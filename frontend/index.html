<!doctype html>
<!-- The theme surface sits on <html>: the root element's background paints the whole
     canvas whatever its own box height is.

     h-dvh is the one definite height in the app, and body, #root and the shell in
     __root.tsx carry it down by percentage - a chain that resolves only because every
     link in it is present. Nothing below scrolls the window: each page bounds its own
     table instead, which is what keeps a table's header row in view. -->
<html lang="en" class="h-dvh bg-base-200 text-base-content">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
