[workspace]
name = "expense-tracker"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Production / runtime dependencies (the "default" feature).
# Folded into EVERY environment, so both default and prod get these.
[dependencies]
python = "==3.14.6"
flask = "==3.1.2"
flask-wtf = "==1.3.0"

# The app itself, installed editable so `expense_tracker` imports everywhere
# (tests, serve, REPL) with no PYTHONPATH. pixi builds it via hatchling.
[pypi-dependencies]
expense-tracker = { path = ".", editable = true }

# Dev task(s) live with the dev tooling in the "test" feature; see below.

# Test-only dependencies, isolated in the "test" feature so the lean
# prod environment can exclude them.
[feature.test.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.0.0"
basedpyright = "==1.39.8"
ruff = "==0.15.21"
# Frontend toolchain (vite/tailwind) and the language servers Zed is pinned to.
# Previously arrived transitively via basedpyright; pinned explicitly now that the
# build depends on it. Stays in the test feature so prod remains Node-free.
nodejs = "==26.5.0"

# Test task lives with the test feature: present in default (which includes
# the test feature), absent from prod.
[feature.test.tasks]
# FLASK_SECRET_KEY here is a dev-only value used to sign CSRF tokens (pixi.toml is
# not scanned by Sonar); production supplies a real secret via the environment.
# Dev server with reloader + debugger; in the dev feature so the lean prod env
# cannot launch the debugger. No PYTHONPATH needed (app is installed editable).
serve = { cmd = "flask --app expense_tracker:create_app run --debug", env = { FLASK_SECRET_KEY = "dev-insecure-do-not-use-in-production" } }
test = { cmd = "pytest", env = { FLASK_SECRET_KEY = "dev-insecure-do-not-use-in-production" } }
typecheck = "basedpyright"
lint = "ruff check"
fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"

# Frontend (vite + React + Tailwind v4). The build output in
# src/expense_tracker/static/ is committed, so `web-verify` is the gate that keeps
# it in step with frontend/ and greeting.json.
web-install = "npm ci"
web-build = "npm run build"
web-check = "npm run check"
web-format = "npm run format"
# Zed formats on save with the project's pinned prettier, so this is the gate that
# keeps editor output and CI in agreement.
web-format-check = "npm run format-check"
web-verify = "npm run build && git diff --exit-code -- src/expense_tracker/static"

# Two environments on one solve-group:
# - default: runtime + test tooling -> editor, local dev, CI, `pixi run test`
# - prod:    runtime only (default feature) -> what a Docker image installs
# Same solve-group keeps python pinned identically across both.
[environments]
default = { features = ["test"], solve-group = "prod" }
prod = { solve-group = "prod" }
