[workspace]
name = "expense-tracker"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Production / runtime dependencies (the "default" feature).
# Folded into EVERY environment, so both default and prod get these.
[dependencies]
python = "==3.14.6"
# fastapi-core, not fastapi: on conda-forge the plain `fastapi` package is the
# `fastapi[standard]` bundle and drags uvicorn-standard, jinja2, python-multipart,
# email_validator and fastapi-cli into the lean prod environment. This app uses none
# of them.
fastapi-core = "==0.141.1"
uvicorn = "==0.52.0"

# The app itself, installed editable so `expense_tracker` imports everywhere
# (tests, serve, REPL) with no PYTHONPATH. pixi builds it via hatchling from
# backend/pyproject.toml.
[pypi-dependencies]
expense-tracker = { path = "backend", editable = true }

# Dev task(s) live with the dev tooling in the "test" feature; see below.

# Test-only dependencies, isolated in the "test" feature so the lean
# prod environment can exclude them.
[feature.test.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.0.0"
# What starlette's TestClient runs on; test-only, so prod does not ship it. It must
# be httpx2 rather than httpx: starlette imports `httpx2 as httpx` under
# TYPE_CHECKING, so with plain httpx the client is typed as Unknown and basedpyright
# fails the strict-mode gate.
httpx2 = "==2.9.1"
basedpyright = "==1.39.8"
ruff = "==0.15.21"
# Frontend toolchain (vite/tailwind) and the language servers Zed is pinned to.
# Previously arrived transitively via basedpyright; pinned explicitly since the
# frontend build depends on it. Stays in the test feature, which is what keeps the
# prod environment Node-free - and now nothing in the backend wants Node anyway.
nodejs = "==26.5.0"
# The package manager, pinned here rather than via a "packageManager" field in
# package.json: pnpm's pmOnFail defaults to "download", so that field would make pnpm
# fetch its own version and bypass this pin. pixi is the single source of truth.
pnpm = "==11.18.0"

# Test task lives with the test feature: present in default (which includes
# the test feature), absent from prod.
#
# Each stack's tooling reads its config from its own directory - ruff, pytest and
# basedpyright from backend/pyproject.toml, the pnpm scripts from
# frontend/package.json - so the tasks below carry an explicit `cwd` rather than
# relying on where `pixi run` happened to be invoked.
[feature.test.tasks]
# The REST API with the reloader, on uvicorn's default port 8000. It serves JSON and
# nothing else - the page comes from `web-dev` on vite's own port, and CORS is what
# lets the two talk. --factory is what lets create_app be the target. In the test
# feature so the lean prod env cannot launch the reloader. Runs from the repo root -
# no cwd and no PYTHONPATH needed, because the app is installed editable.
# --reload-dir is not optional: without it uvicorn watches the whole working
# directory, and its stat reloader rglobs for *.py and stats every hit four times a
# second -- which here means walking .pixi/ and node_modules/ to find 1891 files when
# only the 2 under backend/src/ can ever matter.
serve = "uvicorn expense_tracker:create_app --factory --reload --reload-dir backend/src"
# Writes backend/coverage.xml for the SonarCloud scan (see sonar-project.properties).
test = { cmd = "pytest", cwd = "backend" }
# The one task with no cwd, deliberately. basedpyright reads pyrightconfig.json at the
# repo root, which is also the only place an editor's language server looks for it -
# running from backend/ would find no config and silently fall back to a different
# rule set. See the comment in pyrightconfig.json.
typecheck = "basedpyright"
lint = { cmd = "ruff check", cwd = "backend" }
fix = { cmd = "ruff check --fix", cwd = "backend" }
format = { cmd = "ruff format", cwd = "backend" }
format-check = { cmd = "ruff format --check", cwd = "backend" }

# Frontend (vite + React + Tailwind v4). A standalone SPA: it builds to
# frontend/dist/, which is gitignored and shipped by nothing here, and reaches the API
# over CORS at the origin in frontend/.env. Nothing in this group touches backend/.
web-install = { cmd = "pnpm install --frozen-lockfile", cwd = "frontend" }
web-build = { cmd = "pnpm run build", cwd = "frontend" }
# vite's dev server, the counterpart to `serve`. The two run side by side: this one
# serves the page, `serve` answers its fetches from another origin.
web-dev = { cmd = "pnpm run dev", cwd = "frontend" }
web-check = { cmd = "pnpm run check", cwd = "frontend" }
# eslint, the frontend counterpart to `lint`/`fix`. Type-aware, so it needs the same
# tsconfigs `web-check` uses and costs about as much. Zed's built-in eslint language
# server is pointed at frontend/node_modules by .zed/settings.json, so the editor
# reports the same findings this task fails on.
web-lint = { cmd = "pnpm run lint", cwd = "frontend" }
web-lint-fix = { cmd = "pnpm run lint-fix", cwd = "frontend" }
# vitest + coverage; writes coverage/frontend/lcov.info at the repo root for the
# SonarCloud scan, mirroring how `test` writes coverage.xml for Python.
web-test = { cmd = "pnpm run test", cwd = "frontend" }
web-format = { cmd = "pnpm run format", cwd = "frontend" }
# Zed formats on save with the project's pinned prettier, so this is the gate that
# keeps editor output and CI in agreement.
web-format-check = { cmd = "pnpm run format-check", cwd = "frontend" }

# Two environments on one solve-group:
# - default: runtime + test tooling -> editor, local dev, CI, `pixi run test`
# - prod:    runtime only (default feature) -> the API and nothing else
# Same solve-group keeps python pinned identically across both. prod is Node-free by
# construction now that the backend ships no frontend assets.
[environments]
default = { features = ["test"], solve-group = "prod" }
prod = { solve-group = "prod" }
