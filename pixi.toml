# Forwarders only. Each stack defines its commands in its own manifest - poe tasks in
# backend/pyproject.toml, "scripts" in frontend/package.json - and this file aggregates
# them under `pixi run`. Adding a command means two edits; see CLAUDE.md.

[workspace]
name = "expense-tracker"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Runtime LIBRARIES, folded into every environment that does not opt out - `frontend` is
# the one that does, at the bottom of this file. The app itself is installed per
# environment, in the two blocks below.
[dependencies]
python = "==3.15.1"
# fastapi-core, not fastapi: on conda-forge `fastapi` is the `fastapi[standard]` bundle
# and drags uvicorn-standard, jinja2, python-multipart, email_validator and fastapi-cli in.
fastapi-core = "==0.162.0"
uvicorn = "==0.54.0"
# The ORM and the driver. asyncpg speaks the PostgreSQL wire protocol directly, so this
# pair pulls in no libpq, no client binaries and no server.
sqlalchemy = "==2.1.6"
asyncpg = "==0.32.0"
# What sqlalchemy.ext.asyncio runs its sync-to-async bridge on. SQLAlchemy declares it
# under the `asyncio` extra and 2.1 no longer resolves it on its own, and conda has no
# extras - the same reason fastapi-core is spelled out above. Without it every import of
# the app raises ImportError before a single test collects.
greenlet = "==3.5.6"
# Resolved here by fastapi-core anyway; declared because create_app() imports it directly.
pydantic = "==2.14.1"
# Resolved by pydantic, declared on the same terms: expense_loader raises its
# PydanticCustomError directly, so that a refusal reads as the loader's own message.
pydantic-core = "==2.50.1"
# What expense_loader parses $EXPENSE_DATA_DIR's month files with. Already in the lock as a
# poethepoet dependency; declared because that module imports it, and here rather than in a
# feature because the backend wheel ships it.
pyyaml = "==6.0.3"
# What config.py validates the database settings with. Only the BaseSettings half is used;
# loading backend/.env is direnv's job (`dotenv_if_exists` in .envrc), never the app's.
pydantic-settings = "==2.16.1"

# The app in two flavours: editable for development, a hatchling-built wheel for the
# image. See backend/CLAUDE.md.
[feature.dev.pypi-dependencies]
expense-tracker = { path = "backend", editable = true }

[feature.backend.pypi-dependencies]
expense-tracker = { path = "backend", editable = false }

# Test-only dependencies, isolated in the "test" feature so the lean
# backend environment can exclude them.
[feature.test.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
# What starlette's TestClient runs on. httpx2 rather than httpx: starlette imports
# `httpx2 as httpx` under TYPE_CHECKING, so plain httpx types the client as Unknown and
# basedpyright fails the gate.
httpx2 = "==2.16.0"
basedpyright = "==1.40.2"
ruff = "==0.17.2"
# The backend's task runner, reading [tool.poe.tasks] from backend/pyproject.toml.
poethepoet = "==0.49.0"
# The server, and the initdb/pg_ctl/psql/createdb binaries the db-* poe tasks drive.
# Development and CI only: keeping it out of [dependencies] is what keeps it - and libpq,
# icu, krb5, openldap and liburing behind it - out of the backend environment.
postgresql = "==18.6"

# The frontend toolchain, in a feature of its own so the `frontend` environment can hold
# it and nothing else - no python, no PostgreSQL, no editable backend install, which is
# what lets the SPA image build from a context that has no backend in it. `default`
# includes this feature too, which is what keeps `pixi run frontend-build` working from a
# blessed shell and gives Zed the language servers it is pinned to.
[feature.frontend.dependencies]
nodejs = "==26.12.1"
# Pinned here rather than by a "packageManager" field in package.json: pnpm's pmOnFail
# defaults to "download", so that field would fetch its own version and bypass this pin.
pnpm = "==12.4.1"

# No [activation.env], deliberately: the connection settings are declared once, in
# backend/.env. See backend/CLAUDE.md.

# From PyPI rather than conda-forge: import-linter 2.11 moved fastapi and uvicorn behind
# a "ui" extra, and conda has no extras, so the recipe still carries both as hard
# dependencies plus nox. From PyPI it declares click, grimp, rich and typing-extensions.
[feature.test.pypi-dependencies]
import-linter = "==2.15"

# Forwarders, each in the feature that carries its runner - poe in the test feature, pnpm
# in the frontend one - so `backend` has neither to forward to. Each names a task defined
# elsewhere and sets the cwd its runner needs; no command body lives here. Alphabetical,
# which is the order `pixi task list` prints.
[feature.test.tasks]
# With cwd=backend, poe finds backend/pyproject.toml unaided, so these need no -C.
backend-db-create = { cmd = "poe db-create", cwd = "backend" }
backend-db-init = { cmd = "poe db-init", cwd = "backend" }
backend-db-reset = { cmd = "poe db-reset", cwd = "backend" }
backend-db-start = { cmd = "poe db-start", cwd = "backend" }
backend-db-stop = { cmd = "poe db-stop", cwd = "backend" }
# Brings the local cluster up first, through the poe task's db-init dep.
backend-dev = { cmd = "poe dev", cwd = "backend" }
backend-format = { cmd = "poe format", cwd = "backend" }
backend-format-check = { cmd = "poe format-check", cwd = "backend" }
# The one forwarder whose tool pixi does not install: docker has to be on PATH already.
backend-image = { cmd = "poe image", cwd = "backend" }
backend-lint = { cmd = "poe lint", cwd = "backend" }
backend-lint-fix = { cmd = "poe lint-fix", cwd = "backend" }
backend-load-currencies = { cmd = "poe load-currencies", cwd = "backend" }
backend-load-expenses = { cmd = "poe load-expenses", cwd = "backend" }
# Writes backend/coverage.xml for the SonarCloud scan (see sonar-project.properties).
backend-test = { cmd = "poe test", cwd = "backend" }
backend-typecheck = { cmd = "poe typecheck", cwd = "backend" }

# Frontend -> the "scripts" block in frontend/package.json. `install` is a pnpm built-in
# rather than a script, which is why it alone takes no `run`. Declared in the frontend
# feature so `pixi run -e frontend <task>` reaches them with nothing else installed.
[feature.frontend.tasks]
frontend-build = { cmd = "pnpm run build", cwd = "frontend" }
# vite's dev server, the counterpart to backend-dev. The two run side by side.
frontend-dev = { cmd = "pnpm run dev", cwd = "frontend" }
frontend-format = { cmd = "pnpm run format", cwd = "frontend" }
# The formatting gate. .zed/settings.json does not enable format_on_save, so formatting is
# applied by frontend-format and checked here rather than by the editor.
frontend-format-check = { cmd = "pnpm run format-check", cwd = "frontend" }
frontend-install = { cmd = "pnpm install --frozen-lockfile", cwd = "frontend" }
# Type-aware, so it builds the same full TS program frontend-typecheck does and then runs
# every rule over it - about twice the cost, which is why CI puts it last.
frontend-lint = { cmd = "pnpm run lint", cwd = "frontend" }
frontend-lint-fix = { cmd = "pnpm run lint-fix", cwd = "frontend" }
# vitest + coverage; writes coverage/frontend/lcov.info at the repo root for the
# SonarCloud scan, mirroring how backend-test writes coverage.xml for Python.
frontend-test = { cmd = "pnpm run test", cwd = "frontend" }
frontend-typecheck = { cmd = "pnpm run typecheck", cwd = "frontend" }

# Three environments on one solve-group, which is what keeps every shared pin identical
# across them - python and the runtime libraries between default and backend, node and
# pnpm between default and frontend:
# - default:  runtime libraries + test tooling + the frontend toolchain + the editable
#             app -> local dev, CI, editor
# - backend:  runtime libraries + the app as a wheel -> the API image and nothing else
# - frontend: the frontend toolchain alone -> the SPA image and nothing else
#
# `no-default-feature` is what makes frontend lean: [dependencies] is the default feature
# and is folded into every environment that does not say otherwise, so without the flag
# that environment would carry python, fastapi and asyncpg it never runs.
[environments]
default = { features = ["test", "frontend", "dev"], solve-group = "shared" }
backend = { features = ["backend"], solve-group = "shared" }
frontend = { features = ["frontend"], no-default-feature = true, solve-group = "shared" }
