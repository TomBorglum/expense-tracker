[workspace]
name = "expense-tracker"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Production / runtime dependencies (the "default" feature).
# Folded into EVERY environment, so both default and prod get these.
[dependencies]
python = "==3.14.6"
flask = "==3.1.2"
flask-wtf = "==1.3.0"

# The app itself, installed editable so `expense_tracker` imports everywhere
# (tests, serve, REPL) with no PYTHONPATH. pixi builds it via hatchling.
[pypi-dependencies]
expense-tracker = { path = ".", editable = true }

# Dev task(s) live with the dev tooling in the "test" feature; see below.

# Test-only dependencies, isolated in the "test" feature so the lean
# prod environment can exclude them.
[feature.test.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.0.0"
basedpyright = "==1.39.8"
ruff = "==0.15.21"
# Runs the Tailwind CLI and, in the editor, the Tailwind language server. Already
# arrives transitively via basedpyright (depends: nodejs >=20); pinned explicitly so
# the CSS build does not rest on another package's dependency. Dev feature only, so
# the prod environment stays free of it.
nodejs = "==26.5.0"

# Test task lives with the test feature: present in default (which includes
# the test feature), absent from prod.
[feature.test.tasks]
# FLASK_SECRET_KEY here is a dev-only value used to sign CSRF tokens (pixi.toml is
# not scanned by Sonar); production supplies a real secret via the environment.
# Dev server with reloader + debugger; in the dev feature so the lean prod env
# cannot launch the debugger. No PYTHONPATH needed (app is installed editable).
serve = { cmd = "flask --app expense_tracker:create_app run --debug", env = { FLASK_SECRET_KEY = "dev-insecure-do-not-use-in-production" } }
test = { cmd = "pytest", env = { FLASK_SECRET_KEY = "dev-insecure-do-not-use-in-production" } }
typecheck = "basedpyright"
lint = "ruff check"
fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
# Tailwind is pinned in package.json/package-lock.json rather than fetched as a
# standalone binary, so the compiler and the editor's Tailwind language server load
# the identical version - the language server resolves `tailwindcss` from
# node_modules, and a second independently-pinned copy would drift from this one.
# The compiled app.css is committed, so a fresh clone serves a styled page without
# running any of this, and prod needs neither Node nor node_modules.
css-install = "npm ci"
css-build = { cmd = "node_modules/.bin/tailwindcss -i src/expense_tracker/tailwind.css -o src/expense_tracker/static/css/app.css --minify", depends-on = [
  "css-install",
] }
css-watch = { cmd = "node_modules/.bin/tailwindcss -i src/expense_tracker/tailwind.css -o src/expense_tracker/static/css/app.css --watch", depends-on = [
  "css-install",
] }
# Freshness gate: rebuild, then fail if the committed CSS is stale relative to the
# templates and tailwind.css it is generated from. ls-files first because `git diff`
# reports no change for an untracked file, which would pass a missing app.css.
css-check = { cmd = "git ls-files --error-unmatch src/expense_tracker/static/css/app.css > /dev/null && git diff --exit-code -- src/expense_tracker/static/css/app.css", depends-on = [
  "css-build",
] }

# Two environments on one solve-group:
# - default: runtime + test tooling -> editor, local dev, CI, `pixi run test`
# - prod:    runtime only (default feature) -> what a Docker image installs
# Same solve-group keeps python pinned identically across both.
[environments]
default = { features = ["test"], solve-group = "prod" }
prod = { solve-group = "prod" }
