# Environments and dependencies only. This manifest declares no tasks, deliberately:
# each stack owns its commands in the file that already owns how its tools behave - the
# poe tasks in backend/pyproject.toml, the "scripts" block in frontend/package.json. A
# forwarding task here would add a name to look up and nothing else. Invoke either stack
# from the repo root with `poe -C backend <task>` or `pnpm -C frontend run <script>`; the
# full table is in README.md. pixi's job is to put both toolchains on PATH, which .envrc
# does on directory entry and CI's setup-direnv does per job.

[workspace]
name = "expense-tracker"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Production / runtime dependencies (the "default" feature).
# Folded into EVERY environment, so both default and prod get these.
[dependencies]
python = "==3.14.6"
# fastapi-core, not fastapi: on conda-forge the plain `fastapi` package is the
# `fastapi[standard]` bundle and drags uvicorn-standard, jinja2, python-multipart,
# email_validator and fastapi-cli into the lean prod environment. This app uses none
# of them.
fastapi-core = "==0.141.1"
uvicorn = "==0.52.0"

# The app itself, installed editable so `expense_tracker` imports everywhere
# (tests, serve, REPL) with no PYTHONPATH. pixi builds it via hatchling from
# backend/pyproject.toml.
[pypi-dependencies]
expense-tracker = { path = "backend", editable = true }

# Test-only dependencies, isolated in the "test" feature so the lean
# prod environment can exclude them.
[feature.test.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.0.0"
# What starlette's TestClient runs on; test-only, so prod does not ship it. It must
# be httpx2 rather than httpx: starlette imports `httpx2 as httpx` under
# TYPE_CHECKING, so with plain httpx the client is typed as Unknown and basedpyright
# fails the strict-mode gate.
httpx2 = "==2.9.1"
basedpyright = "==1.39.8"
ruff = "==0.15.21"
# The backend's task runner, reading [tool.poe.tasks] from backend/pyproject.toml. Python
# ships no equivalent of package.json's "scripts", so this is what lets the backend own
# its commands the way the frontend already does. Test feature, not [dependencies]: the
# prod environment runs the app, it does not lint or test it.
poethepoet = "==0.41.0"
# Runs the frontend toolchain (vite/tailwind) and the language servers Zed is pinned
# to. Kept in the test feature, which is what keeps the prod environment Node-free:
# the backend ships no frontend assets and wants Node for nothing.
nodejs = "==26.5.0"
# The package manager, pinned here rather than via a "packageManager" field in
# package.json: pnpm's pmOnFail defaults to "download", so that field would make pnpm
# fetch its own version and bypass this pin. pixi is the single source of truth.
pnpm = "==11.18.0"

# Two environments on one solve-group:
# - default: runtime + test tooling -> editor, local dev, CI, both stacks' task runners
# - prod:    runtime only (default feature) -> the API and nothing else
# Same solve-group keeps python pinned identically across both. prod is Node-free by
# construction now that the backend ships no frontend assets.
[environments]
default = { features = ["test"], solve-group = "prod" }
prod = { solve-group = "prod" }
