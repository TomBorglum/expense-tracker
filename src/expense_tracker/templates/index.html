{% extends "base.html" %}

{% block content %}
  <div class="w-full rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-4xl font-bold tracking-tight">{{ greeting }}</h1>
    <p class="mt-3 text-slate-600">
      Served by Flask, styled with Tailwind CSS. The same greeting is available as
      plain text at <a class="font-medium text-sky-700 underline underline-offset-2"
        href="{{ url_for('hello') }}">/api/hello</a>.
    </p>
  </div>
{% endblock %}
