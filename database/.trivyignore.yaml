# Suppressions for the HIGH/CRITICAL gate, covering the database image alone. Named by
# .github/docker-hub-publish.yml under `database:`, relative to this directory; a file
# the config does not name is applied to nothing.
#
# ONLY REACHABLE FINDINGS BELONG HERE. A finding whose vulnerable code this image cannot
# execute is a durable property of the image rather than something to wait out, and it
# goes to .vex/database.openvex.json as an OpenVEX not_affected statement with no date.
# Every entry below is a finding that ships, and that is the whole difference between the
# two files. docs/publish.md states the four-case triage.
#
# TWO MEANINGS FOR A DATE, and which one an entry carries depends on the fix:
#   - A fix is published and the base has not been rebuilt with it: the date is when that
#     rebuild is expected, and expiry re-blocks the release rather than reminding anyone.
#     Clearing the entry is a base bump, not an edit here.
#   - No fix is published: the date is review-by, and the finding ships past it.
# Every entry below is the first kind, so they share one date. Removing a date instead of
# extending it turns this file into a permanent blind spot.
#
# krb5-libs 1.22.3-r0 is published in alpine v3.24/main and absent from
# postgres:18-alpine. The digest pinned in Dockerfile is already the newest its tag
# resolves to, so there is nothing to re-pin to - only an upstream rebuild clears these.
# Switching this image to the debian variant is not the answer and was measured: 62
# HIGH/CRITICAL, with a fix available for none of them.
#
# Dependabot's docker ecosystem covers this base (README.md, under Container images), so
# the base bump that clears these arrives on its own.
#
# THE KRB5 SIXTEEN ARE ONE FINDING in every respect that matters here: krb5-libs
# 1.22.2-r1, every one fixed in 1.22.3-r0, every one in the KDC, kadmind or GSS-RPC paths.
# This image runs none of those - it is a PostgreSQL server, and /usr/lib/krb5 holds the
# libraries a KDC would use - but /usr/local/bin/postgres and libpq.so.5 do link
# libgssapi_krb5, the base being built --with-gssapi, so the library is in the server's
# address space. Kerberos authentication is never negotiated: stack/compose.yaml sets
# POSTGRES_HOST_AUTH_METHOD to trust and no pg_hba entry names gss. Reachable by that
# linkage alone, and listed here rather than in the VEX document because the claim that
# clears them rests on how the server is configured rather than on what the image
# contains.
vulnerabilities:
