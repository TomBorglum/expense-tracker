# Suppressions for the HIGH/CRITICAL gate in the release workflow. Applied to every image
# scan; an entry that does not match an image is simply inert.
#
# ONLY REACHABLE FINDINGS BELONG HERE. A finding whose vulnerable code no image of ours
# can execute is a durable property of the image rather than something to wait out, and it
# goes to .vex/expense-tracker.openvex.json as an OpenVEX not_affected statement with no
# date. Every entry below is a finding that ships, and that is the whole difference
# between the two files. docs/publish.md states the four-case triage.
#
# `publish.yml` must pass both `trivyignores: .trivyignore.yaml` and
# `vex-documents: .vex/expense-tracker.openvex.json`; a file the caller does not name is
# applied to nothing.
#
# TWO MEANINGS FOR A DATE, and which one an entry carries depends on the fix:
#   - A fix is published and the base has not been rebuilt with it: the date is when that
#     rebuild is expected, and expiry re-blocks the release rather than reminding anyone.
#     Clearing the entry is a base bump, not an edit here.
#   - No fix is published: the date is review-by, and the finding ships past it.
# Every entry below is the first kind, so they share one date. Removing a date instead of
# extending it turns this file into a permanent blind spot.
#
# alpine v3.24/main carries the fixed zlib and musl today, while
# nginxinc/nginx-unprivileged:1.31-alpine, last pushed 2026-10-19, ships neither.
# krb5-libs 1.22.3-r0 is likewise published and absent from postgres:18-alpine. The
# digest pinned in each Dockerfile is already the newest its tag resolves to, so there is
# nothing to re-pin to - only an upstream rebuild clears these. Switching either image to
# the debian variant is not the answer and was measured both times: 60 HIGH/CRITICAL for
# nginx and 62 for postgres, with a fix available for none of them.
#
# Dependabot's docker ecosystem covers all three bases (README.md, under Container
# images), so the base bump that clears these arrives on its own.
vulnerabilities:
  - id: CVE-2026-85091
    statement: >-
      zlib heap buffer overflow in gz_vacate(), reached through gzprintf() after a write
      stall; zlib 1.3.2-r0, fixed in 1.3.2-r1. Reachable: /usr/sbin/nginx links zlib
      directly and default.conf.template sets `gzip on;`, so request data reaches the
      library on every compressed response.
    expired_at: 2026-11-30
  - id: CVE-2026-107891
    statement: >-
      musl integer overflows in regcomp() on an untrusted regular expression, in musl and
      musl-utils 1.2.6-r2; fixed in 1.2.6-r3. Treated as reachable because musl is libc.
      Nothing measured compiles an untrusted pattern - nginx matches with PCRE2 and
      compiles only patterns from its own configuration - but a libc fault is not written
      off on the strength of today's call sites.
    expired_at: 2026-11-30
  # THE KRB5 SIXTEEN ARE ONE FINDING in every respect that matters here: krb5-libs
  # 1.22.2-r1 in the database image, every one fixed in 1.22.3-r0, every one in the KDC,
  # kadmind or GSS-RPC paths. The image runs none of those - it is a PostgreSQL server,
  # and /usr/lib/krb5 holds the libraries a KDC would use - but /usr/local/bin/postgres
  # and libpq.so.5 do link libgssapi_krb5, the base being built --with-gssapi, so the
  # library is in the server's address space. Kerberos authentication is never
  # negotiated:
  # stack/compose.yaml sets POSTGRES_HOST_AUTH_METHOD to trust and no pg_hba entry names
  # gss. Reachable by that linkage alone, and listed here rather than in the VEX document
  # because the claim that clears them rests on how the server is configured rather
  # than on what the image contains.
  - id: CVE-2026-107364
    statement: >-
      Unauthenticated KDC DoS via an ASN.1 decoder read overrun. No KDC runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-119079
    statement: Unauthenticated KDC CPU DoS via quadratic ASN.1 decoding. No KDC runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-71200
    statement: >-
      Unauthenticated KDC NULL dereference via a crafted PKINIT pre-auth request. No KDC
      runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-112317
    statement: >-
      Unauthenticated KDC memory leak in the KDB keytab key decryption error path. No KDC
      runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-71199
    statement: >-
      Alteration of authentication indicators in a CAMMAC container, in the KDC's ticket
      path. No KDC runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-112315
    statement: >-
      Unauthenticated kadmind memory leak on an RPCSEC_GSS buffer decode failure. No
      kadmind runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-112316
    statement: >-
      Authenticated kadmind memory leak on an xdr_krb5_tl_data() decode failure. No
      kadmind runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-112318
    statement: >-
      Authenticated kadmind DoS dereferencing a null policy name pointer. No kadmind runs
      here.
    expired_at: 2026-11-30
  - id: CVE-2026-112319
    statement: >-
      Authenticated kadmind memory exhaustion via unbounded RPC XDR allocation. No kadmind
      runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-112320
    statement: >-
      Unauthenticated kadmind memory leak via GSS-RPC auth flavor switching. No kadmind
      runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-112321
    statement: >-
      Unauthenticated kadmind memory leak in AUTH_GSSAPI_INIT error paths. No kadmind runs
      here.
    expired_at: 2026-11-30
  - id: CVE-2026-112322
    statement: >-
      Unauthenticated kadmind CPU DoS in AUTH_GSSAPI client state cleanup. No kadmind runs
      here.
    expired_at: 2026-11-30
  - id: CVE-2026-112323
    statement: >-
      Unauthenticated kadmind memory exhaustion via failed AUTH_GSSAPI_INIT requests. No
      kadmind runs here.
    expired_at: 2026-11-30
  - id: CVE-2026-118380
    statement: >-
      kadmind request alteration and protected information disclosure. No kadmind runs
      here.
    expired_at: 2026-11-30
  - id: CVE-2026-40355
    statement: >-
      NULL dereference in the NegoEx mechanism, reached while negotiating GSSAPI. The
      server negotiates no Kerberos authentication.
    expired_at: 2026-11-30
  - id: CVE-2026-40356
    statement: >-
      Integer underflow and out-of-bounds read, reached while negotiating GSSAPI. The
      server negotiates no Kerberos authentication.
    expired_at: 2026-11-30
