sonar.organization=tomborglum
sonar.projectKey=TomBorglum_expense-tracker

# Analyze the whole repo. Sonar auto-detects supported languages; no per-language
# config is needed here.
sonar.sources=.

# Generated or vendored content that should not be analyzed: the Tailwind output CSS
# is committed but machine-generated, and bin/ holds the fetched tailwindcss binary.
sonar.exclusions=expense_tracker/static/dist/**,bin/**,.pixi/**
