sonar.organization=tomborglum
sonar.projectKey=TomBorglum_expense-tracker

# Separate application code from tests so Sonar reports on each correctly, and
# ingest pytest-cov coverage. Sonar auto-detects supported languages.
sonar.sources=src,frontend/src
sonar.tests=tests,frontend/tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# Written by `pixi run web-test`. Paths inside are repo-root relative because
# vite.config.ts pins vitest's root to the repo root; without that they would be
# relative to frontend/ and resolve against the Python package instead.
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

# src/expense_tracker/static/ is generated, minified vite output, not hand-written
# source; analyzing it would report on bundled dependencies.
sonar.exclusions=src/expense_tracker/static/**

# main.tsx only wires React to the DOM; there is no logic worth asserting. Kept in
# step with the coverage.exclude list in vite.config.ts.
sonar.coverage.exclusions=frontend/src/main.tsx
