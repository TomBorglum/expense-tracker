sonar.organization=tomborglum
sonar.projectKey=TomBorglum_expense-tracker

# Separate application code from tests so Sonar reports on each correctly, and
# ingest pytest-cov coverage. Sonar auto-detects supported languages.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.python.version=3.14
# Written by `pixi run backend-test`, which runs with cwd=backend. Its <source> root is
# an absolute path, so Sonar resolves the class paths wherever the report sits.
sonar.python.coverage.reportPaths=backend/coverage.xml
# Written by `pixi run frontend-test`. Paths inside are repo-root relative because
# vite.config.ts pins vitest's root to the repo root; without that they would be
# relative to frontend/ and resolve against the Python package instead.
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

# main.tsx only wires React to the DOM; there is no logic worth asserting, and
# routeTree.gen.ts is generated from frontend/src/routes. Kept in step with the
# coverage.exclude list in vite.config.ts.
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/routeTree.gen.ts

# sonar.sources above would otherwise hand the generated tree to the JS/TS analyzer,
# and the line above silences only its coverage half. Its `as any` casts are the
# generator's, on a file the next vite run overwrites, so the issues raised on it
# could be neither acted on nor kept fixed.
sonar.exclusions=frontend/src/routeTree.gen.ts
