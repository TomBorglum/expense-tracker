sonar.organization=tomborglum
sonar.projectKey=TomBorglum_expense-tracker

# Main sources vs test sources. Kept disjoint (Sonar requires this) so test files
# are not counted as production code that needs coverage.
sonar.sources=src,templates
sonar.tests=tests

# Pin the analyzed Python version to the pinned toolchain (pixi.toml: ==3.14.6)
# so Sonar stops analyzing against all Python 3 versions and reports precisely.
sonar.python.version=3.14

# Coverage report produced by `pixi run test` (pytest --cov ... --cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml

# The `python -m expense_tracker` launcher only wires up and runs the app; it is
# not unit-testable, so exclude it from the coverage metric (still analyzed for
# issues). The route in server.py is covered by tests/test_server.py.
sonar.coverage.exclusions=src/expense_tracker/__main__.py
