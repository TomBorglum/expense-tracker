[project]
name = "expense-tracker"
version = "0"                    # inert placeholder; release version lives in .release-please-manifest.json
requires-python = ">=3.14"
dependencies = []               # runtime deps are conda-pinned in pixi.toml (repo convention, CLAUDE.md)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

[tool.pytest.ini_options]
addopts = "--cov=expense_tracker --cov-report=xml --cov-report=term-missing"

[tool.basedpyright]
typeCheckingMode = "strict"
extraPaths = ["src"]
