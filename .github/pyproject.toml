# Not a Python package, and there is no [project] table: this file exists so that the one
# command this directory runs is DEFINED in this directory, the way database/pyproject.toml
# does for the database image.

[tool.poe]
# The environment is already active, as in database/pyproject.toml: "simple" stops poe
# hunting for a poetry/uv project or a .venv that does not exist here.
executor = "simple"

[tool.poe.tasks]
# The cap on one comment block in a workflow, which is what keeps rationale in CLAUDE.md
# and README.md rather than in the YAML. The threshold and the counting rule are in
# comment_blocks.py, its only declaration. ruff and pyright are configured for backend/
# alone and do not reach that file.
comment-check = "python comment_blocks.py"
