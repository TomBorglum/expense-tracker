version: 2
updates:
  # pixi.toml is not covered here: Dependabot has no pixi ecosystem, and its conda one
  # reads only environment.yml. update-pixi-dependencies.yml bumps every pin in it
  # instead, python included. pixi itself is pinned by hand, in .envrc and both
  # Dockerfiles; the docker entry below ignores that image.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Only default-days here: github-actions does not support the semver-*-days
    # tiers, which are silently ignored rather than rejected.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  # Two preconditions, neither checked: package.json must stay free of a
  # "packageManager" field, or pnpm 11 writes a multi-document lockfile Dependabot
  # cannot parse (dependabot-core#14794), and pnpm-lock.yaml must stay at
  # lockfileVersion 9.0, which is also what lands Dependabot on pnpm 10.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # default-days must stay equal to minimumReleaseAge in
    # frontend/pnpm-workspace.yaml, and no tier may sit below it. Both files carry the
    # constraint; the mechanism is in README.md under "Package manager".
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # vtsls, the language server Zed drives, rejects a TypeScript 7 tsdk and silently
    # falls back to its own copy, so this holds the editor rather than CI - `tsc -b` on
    # 7 is fine. Revisit on zed-extensions/tsgo#61. An ignore also suppresses security
    # updates, acceptable for a devDependency of a private package.json.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">= 7"
    versioning-strategy: "increase"
    commit-message:
      # Which one a PR gets is decided in package.json, not here: "deps" if any package
      # in it came from "dependencies", "chore" otherwise.
      prefix: "deps"
      prefix-development: "chore"
    groups:
      frontend:
        patterns:
          - "*"
        # Majors fall outside the group and get their own PR.
        update-types:
          - "minor"
          - "patch"

  # The runtime base of all three images, pinned `tag@sha256:...` in backend/Dockerfile,
  # database/Dockerfile and frontend/Dockerfile. The docker ecosystem moves that pair as a
  # unit. One entry covers every directory, and a pull request arrives per directory.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/database"
      - "/frontend"
    schedule:
      interval: "weekly"
    # Applies to the nginx and postgres bases. Dependabot takes publication dates from
    # Docker Hub's tag_last_pushed, which covers both; for gcr.io and ghcr.io it logs
    # cooldown_date_unavailable and allows the update. default-days is the whole window,
    # an update that moves a digest under an unchanged tag carrying no semver level.
    cooldown:
      default-days: 3
    # The pixi builder image. That version is pinned by hand in three places - .envrc's
    # `use pixi` line and both Dockerfiles - and CLAUDE.md records the trio;
    # update-pixi-dependencies.yml bumps the pins inside pixi.toml. The dependency name
    # is the image alone, ghcr.io belonging to its source, and the leading `*` matches
    # either spelling. Security updates for this image are suppressed with it.
    ignore:
      - dependency-name: "*prefix-dev/pixi"
    # A runtime base is part of what a user receives when they run the image, which is
    # the line CONTRIBUTING.md draws between deps and ci. The patch release this cuts is
    # what republishes the image: publish.yml publishes when a GitHub Release is
    # published.
    commit-message:
      prefix: "deps"
