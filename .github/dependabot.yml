version: 2
updates:
  # Keep the GitHub Actions referenced in workflows up to date, including the
  # setup-direnv action pinned by SHA and the other pinned actions. The pixi.toml
  # python pin is handled separately by update-python.yml, since Dependabot has no
  # conda/pixi support.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # "ci": these actions run only in CI, so label their bumps accordingly and
      # consistently with the workflow's own commits.
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Frontend toolchain (vite + React + Tailwind). package.json and pnpm-lock.yaml
  # live at the repo root, not in frontend/, so the directory is "/". pnpm is driven
  # through the "npm" ecosystem: Dependabot picks pnpm once it sees pnpm-lock.yaml.
  #
  # Two preconditions here are easy to break by accident:
  #   - package.json must stay free of a "packageManager" field. pnpm 11 writes a
  #     multi-document lockfile when it manages its own version, and Dependabot
  #     cannot parse that (dependabot-core#14794). pixi.toml pins pnpm instead, and
  #     its comment there gives the other reason to keep it out of package.json.
  #   - The lockfile must stay at lockfileVersion 9.0, which Dependabot does parse.
  #
  # Bumps to vite, @vitejs/plugin-react, tailwindcss, @tailwindcss/vite, react or
  # react-dom change the committed bundle in src/expense_tracker/static/, so
  # `pixi run web-verify` fails on those PRs until `pixi run web-build` output is
  # committed to the Dependabot branch.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bump the exact pin ("4.3.3" to "4.3.4") rather than widening it to a range,
    # per the exact-pin rule in CLAUDE.md.
    versioning-strategy: "increase"
    commit-message:
      # "deps": react/tailwind/vite output ships inside the committed bundle, so
      # these bumps are user-visible and belong in the changelog's Dependencies
      # section (and cut a release). No prefix-development: every package here is a
      # devDependency, so it would swallow the whole ecosystem.
      prefix: "deps"
    groups:
      frontend:
        patterns:
          - "*"
        # Minor and patch ride together in one weekly PR; majors fall outside the
        # group and get their own PR, so a breaking React or Vite bump is reviewed
        # and revertable on its own.
        update-types:
          - "minor"
          - "patch"
