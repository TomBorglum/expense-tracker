version: 2
updates:
  # Keep the GitHub Actions referenced in workflows up to date, including the
  # setup-direnv action pinned by SHA and the other pinned actions. The pixi.toml
  # python pin is handled separately by update-python.yml, since Dependabot has no
  # conda/pixi support.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # "ci": these actions run only in CI, so label their bumps accordingly and
      # consistently with the workflow's own commits.
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Frontend toolchain (vite + React + Tailwind). package.json and pnpm-lock.yaml
  # live in frontend/ alongside the sources they describe, so the directory is
  # "/frontend". pnpm is driven through the "npm" ecosystem: Dependabot picks pnpm
  # once it sees pnpm-lock.yaml.
  #
  # Two preconditions here are easy to break by accident:
  #   - package.json must stay free of a "packageManager" field. pnpm 11 writes a
  #     multi-document lockfile when it manages its own version, and Dependabot
  #     cannot parse that (dependabot-core#14794). pixi.toml pins pnpm instead, and
  #     its comment there gives the other reason to keep it out of package.json.
  #   - The lockfile must stay at lockfileVersion 9.0, which Dependabot does parse.
  #
  # No build output is committed here, so a bump to vite, react or tailwind needs
  # nothing added to the Dependabot branch - CI's `pixi run frontend-build` is what proves
  # the bundler still runs. msw is test-only, but a major bump needs its allowBuilds
  # entry in frontend/pnpm-workspace.yaml rechecked.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Spelled out rather than inherited: Dependabot already applies a 3-day cooldown
    # to version updates when this block is absent, so the wait exists either way -
    # this only makes it visible and tunable. A release younger than its cooldown is
    # skipped by that week's run and picked up by a later one.
    #
    # Longer for majors because they cost the most here: a React or Vite major needs
    # the rest of the toolchain (plugin-react, @types/*, testing-library) to catch up
    # first, and arrives as its own PR outside the group. Patches keep the 3-day
    # default. Security updates ignore cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # TypeScript 7 is the native Go rewrite, and its npm package no longer ships
    # tsserver.js or the JS compiler API. vtsls - the language server Zed drives,
    # pinned to frontend/node_modules in .zed/settings.json - validates a tsdk by
    # looking for tsserver.js, so it rejects the worktree copy and silently falls back
    # to its own bundled typescript 5.9.3. The editor would then sit two majors behind
    # the compiler CI runs, with no error shown. Confirmed upstream in
    # zed-industries/zed#60951, #60970 and #61126.
    #
    # `tsc -b` itself is fine on 7, so this hold is about the editor, not CI. Moving to
    # 7 means adopting Zed's tsgo extension, which installs its own TypeScript and
    # cannot be pointed at node_modules, breaking the single-copy pinning used for
    # every other tool here.
    #
    # Revisit when zed-extensions/tsgo#61 ("Resolve project-local TypeScript
    # installations") ships, or when Zed drives TypeScript 7 without an extension.
    # To unblock, delete this whole ignore entry.
    #
    # Note: ignore conditions suppress security updates for this package too. Fine
    # here - typescript is a devDependency of a private package.json, and no compiler
    # code reaches a running application.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">= 7"
    # Bump the exact pin ("4.3.3" to "4.3.4") rather than widening it to a range,
    # per the exact-pin rule in CLAUDE.md.
    versioning-strategy: "increase"
    commit-message:
      # Which prefix a PR gets is decided by package.json, not by this file:
      # Dependabot reads the literal block name a package sits in, and uses "deps"
      # if any package in the PR came from "dependencies", "chore" otherwise. That
      # is any?, not all?, so the weekly grouped PR is "deps" whenever it carries a
      # runtime package and "chore" when it is tooling only.
      #
      # The blocks follow npm's ordinary runtime/build-time convention - react,
      # react-dom, tailwindcss and @tailwindcss/vite are runtime, the rest is
      # tooling. vite and @vitejs/plugin-react are "chore" despite shaping the
      # output, because a bundler bump is nothing a user of the app can act on.
      # Splitting this way costs nothing here - package.json is private and nothing
      # installs it from a registry, so the two blocks carry no packaging meaning of
      # their own.
      #
      # Per release-please-config.json, "deps" is a visible changelog section and
      # cuts a release; "chore" is hidden and does not.
      prefix: "deps"
      prefix-development: "chore"
    groups:
      frontend:
        patterns:
          - "*"
        # Minor and patch ride together in one weekly PR; majors fall outside the
        # group and get their own PR, so a breaking React or Vite bump is reviewed
        # and revertable on its own.
        update-types:
          - "minor"
          - "patch"
