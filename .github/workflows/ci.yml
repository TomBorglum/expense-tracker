name: CI

# All PR/push gates plus the SonarCloud scan, in one job so the scan reuses the coverage
# the test steps wrote. docs/development.md records why.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # SonarCloud PR decoration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The main-protection ruleset requires this check by this name, so renaming it
    # silently drops the gate.
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute issues to the right commits.
          fetch-depth: 0
      - uses: TomBorglum/actions/direnv/setup@8bb5c662cb67237681564ec96cbb7ed84bc4aed8 # v3.0.0
      # Each stack's gates run cheapest first, then its tests, then anything that builds.
      # The two stacks order lint differently; the measurements behind that are in
      # docs/development.md, under Continuous integration.
      - run: pixi run backend-format-check
      - run: pixi run backend-lint
      - run: pixi run backend-typecheck
      # The cluster the postgres-marked tests need, provisioned after the static gates so a
      # lint or type error surfaces first. GitHub sets CI=true, which is what turns a
      # database that failed to come up into a failure rather than a silent skip.
      - run: pixi run backend-db-init
      - run: pixi run backend-test # writes coverage.xml for the scan below
      - run: pixi run frontend-install
      - run: pixi run frontend-format-check
      - run: pixi run frontend-typecheck
      - run: pixi run frontend-lint
      - run: pixi run frontend-test # writes coverage/frontend/lcov.info for the scan below
      # The only gate that runs vite, so a bundler failure surfaces here.
      - run: pixi run frontend-build
      # After the build, which is what rewrites this file: a non-empty diff means a route
      # was added, renamed or removed without committing the generated tree.
      - run: git diff --exit-code -- frontend/src/routeTree.gen.ts
      - uses: TomBorglum/actions/sonar/scan@f3028cddd68f2efc77b63a3f4fd749e541c8701c # v3.1.0
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}