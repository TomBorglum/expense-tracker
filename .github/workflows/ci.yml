name: CI

# Single workflow for all PR/push gates plus the SonarCloud scan. Running them in
# one job means the pixi env is built once and `pixi run backend-test` produces
# coverage.xml once, which the scan step below reuses (no duplicate test run across
# workflows).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # SonarCloud PR decoration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute issues to the right commits.
          fetch-depth: 0
      # Activate the environment declared in .envrc (use pixi), exposing pixi to
      # the steps below - the same .envrc used for local development.
      - uses: TomBorglum/wsl-cloud-init/actions/setup-direnv@7823d83c64795945f41111716373bda3c0ae5d45 # v1.4.0
      # Every step below calls pixi, which forwards to the stack that owns the command
      # (poe in backend/pyproject.toml, pnpm scripts in frontend/package.json). CI knows
      # one entry point, not two.
      #
      # ONE ORDERING RULE, BOTH STACKS: within a stack, static gates run cheapest first,
      # then the test suite, then anything that builds. A broken change therefore fails on
      # the fastest gate that can catch it, and everything after it - including the JDK
      # setup and the scan below - never runs.
      #
      # That rule puts lint at opposite ends of the two lists, which is the point worth
      # knowing rather than a slip. ruff is a native binary matching patterns and is the
      # CHEAPEST backend gate; frontend eslint is type-aware (projectService +
      # strictTypeChecked), so it builds the same full TypeScript program tsc does and
      # then runs every rule over it - the PRICIEST frontend gate, roughly twice the type
      # checker. Cold, as CI always runs them:
      #
      #   backend    lint ~0.2s   format-check ~0.2s   typecheck ~1.1s
      #   frontend   format-check ~0.8s   typecheck ~1.8s   lint ~3.2s
      #
      # (Cold matters for tsc alone: it caches to node_modules/.tmp, and frontend-install
      # rebuilds that directory every run, so the cache is never there to reuse. Warm, it
      # is about a third of the figure above.)
      #
      # The backend's first two are a coin flip at that scale. It is the LAST position in
      # each list that carries the weight, and the two disagree for a reason.
      - run: pixi run backend-lint
      - run: pixi run backend-format-check
      - run: pixi run backend-typecheck
      # The database the greeting is read from. initdb's a cluster into .pgdata/, starts
      # it on 127.0.0.1:5433 and applies backend/schema.sql - the same one task a
      # developer runs, which is why there is no `services:` block and no container
      # here: the server is a conda-forge package in the same lock as everything else.
      # After the static gates, so a lint or type error still surfaces before anything
      # gets provisioned - the one place the cheapest-first rule above yields, because
      # this provisions rather than checks. GitHub sets CI=true, which is what turns a
      # database that failed to come up into a failure rather than a silent skip.
      - run: pixi run backend-db-init
      - run: pixi run backend-test # writes coverage.xml for the scan below
      # Frontend gates. Independent of the Python ones above - the two stacks share
      # no build artifact, so neither group can break the other.
      - run: pixi run frontend-install
      - run: pixi run frontend-format-check
      - run: pixi run frontend-typecheck
      - run: pixi run frontend-lint
      - run: pixi run frontend-test # writes coverage/frontend/lcov.info for the scan below
      # Last of the frontend gates, and the only one that runs vite itself: tsc and
      # vitest between them never exercise the bundler, so without this a build-time
      # failure would only surface on someone's machine. Nothing is kept from the
      # output - frontend/dist/ is gitignored.
      - run: pixi run frontend-build
      # Provide the JRE ourselves so the scanner doesn't query SonarCloud's API to
      # download one at runtime (a transient point of failure). Paired with
      # sonar.scanner.skipJreProvisioning below.
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
