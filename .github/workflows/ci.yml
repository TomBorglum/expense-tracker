name: CI

# Single workflow for all PR/push gates plus the SonarCloud scan. Running them in
# one job means the pixi env is built once and `pixi run backend-test` produces
# coverage.xml once, which the scan step below reuses (no duplicate test run across
# workflows).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # SonarCloud PR decoration

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Named explicitly because the main-protection ruleset requires this check by
    # name. The name is what the gate matches, so it lives here rather than following
    # the job id below it.
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute issues to the right commits.
          fetch-depth: 0
      - uses: TomBorglum/actions/direnv/setup@8bb5c662cb67237681564ec96cbb7ed84bc4aed8 # v3.0.0
      # Every step below calls pixi, which forwards to the stack that owns the command
      # (poe in backend/pyproject.toml, pnpm scripts in frontend/package.json). CI knows
      # one entry point, not two.
      #
      # ONE ORDERING RULE, BOTH STACKS: within a stack, static gates run cheapest first,
      # then the test suite, then anything that builds. A broken change therefore fails on
      # the fastest gate that can catch it, and everything after it - including the JDK
      # setup and the scan below - never runs.
      #
      # That rule puts lint near the end of both lists, for different reasons. backend
      # lint is two tools in one task - ruff over each file, then import-linter over the
      # graph they form - so it costs more than the formatter it follows. frontend eslint
      # is type-aware (projectService + strictTypeChecked), so it builds the same full
      # TypeScript program tsc does and then runs every rule over it - the PRICIEST
      # frontend gate, roughly twice the type checker. Cold, as CI always runs them:
      #
      #   backend    format-check ~0.2s   lint ~0.3s   typecheck ~1.1s
      #   frontend   format-check ~0.8s   typecheck ~1.8s   lint ~3.2s
      #
      # (Cold matters for tsc alone: it caches to node_modules/.tmp, and frontend-install
      # rebuilds that directory every run, so the cache is never there to reuse. Warm, it
      # is about a third of the figure above.)
      #
      # It is the LAST position in each list that carries the weight, and the two disagree
      # for a reason.
      - run: pixi run backend-format-check
      - run: pixi run backend-lint
      - run: pixi run backend-typecheck
      # The database the postgres-marked tests need. initdb's a cluster into backend/.pgdata/,
      # starts it on the host and port backend/.env names and applies backend/schema.sql -
      # the same one task a developer runs. The server is a conda-forge package in the same
      # lock as everything else, so this needs no `services:` block and no container.
      # After the static gates, so a lint or type error still surfaces before anything
      # gets provisioned - the one place the cheapest-first rule above yields, because
      # this provisions rather than checks. GitHub sets CI=true, which is what turns a
      # database that failed to come up into a failure rather than a silent skip.
      - run: pixi run backend-db-init
      - run: pixi run backend-test # writes coverage.xml for the scan below
      # Frontend gates. Independent of the Python ones above - the two stacks share
      # no build artifact, so neither group can break the other.
      - run: pixi run frontend-install
      - run: pixi run frontend-format-check
      - run: pixi run frontend-typecheck
      - run: pixi run frontend-lint
      - run: pixi run frontend-test # writes coverage/frontend/lcov.info for the scan below
      # Last of the frontend gates, and the only one that runs vite itself, so this is
      # where a build-time failure surfaces - tsc and vitest between them exercise no
      # bundler. Nothing is kept from the output - frontend/dist/ is gitignored.
      - run: pixi run frontend-build
      # vite is what regenerates routeTree.gen.ts, so a non-empty diff here means a
      # route file was added, renamed or removed without committing the tree it
      # produces. It sits after the build for that reason: the build is what rewrites the
      # file, where every frontend gate above reads the committed one.
      - run: git diff --exit-code -- frontend/src/routeTree.gen.ts
      # Provide the JRE ourselves so the scanner doesn't query SonarCloud's API to
      # download one at runtime (a transient point of failure). Paired with
      # sonar.scanner.skipJreProvisioning below, which is what makes this JDK the one
      # the scan runs on - so the version here tracks the scanner CLI's floor, and the
      # CLI refuses to start on anything below 21.
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
