name: Release Please

# Automates releases. On every push to main, release-please opens (or updates) a
# single "chore(main): release X.Y.Z" PR that bumps CHANGELOG.md and the version
# manifest from the Conventional Commit messages since the last tag. Merging that
# PR creates the git tag and the GitHub Release with the generated notes.
#
# Authenticates as the expense-tracker-bot GitHub App rather than with GITHUB_TOKEN:
# events created by GITHUB_TOKEN trigger no further workflow runs, where an App
# installation token's do, which is what runs the SonarCloud check on the release PR and
# lets the tag and release reach the workflows downstream of them.
# The App needs Contents: read/write (branch, tag, release), Pull requests:
# read/write (the release PR) and Issues: read/write (the autorelease:* labels).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
