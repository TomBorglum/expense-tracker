name: Update pixi dependencies

# Bumps the versions pinned in pixi.toml, Dependabot carrying no pixi ecosystem. Why it
# authenticates as a GitHub App: docs/automation-app.md.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Queues rather than cancels: a run stopped after it has pushed deps/pixi leaves a
# half-made pull request.
concurrency:
  group: update-pixi-dependencies
  cancel-in-progress: false

jobs:
  # Every input left at its default; the called workflow documents them.
  update:
    uses: TomBorglum/workflows/.github/workflows/update-pixi-dependencies.yml@d39b99286b01a936871326e3f1be9fed7dfc64dc # v1.1.1
    secrets:
      app-client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
