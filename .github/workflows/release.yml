name: Release

# Builds, scans and publishes one image per directory it is given, then publishes one OCI
# compose artifact per compose directory it is given. CALLED, never triggered. It names no
# repository, no file outside the directories it is handed, and exactly two variables:
# IMAGE_PREFIX and IMAGE_TAG, which is the whole contract a compose file answers to.
# TWO INVARIANTS, both stated in CLAUDE.md: no job that checks the repository out gets
# `id-token: write`, and nothing here reads `vars` or names an AWS object. The logs are
# world-readable, so nothing added may print the account id or the PAT either.
# docs/releases.md documents the AWS objects and the whole credential path.

# Every `github.*` reference below is the CALLER's event, which is what a called workflow
# is given. publish.yml carries the triggers and the concurrency group.
on:
  workflow_call:
    inputs:
      image-directories:
        # A JSON array, because `strategy` below reads it through `fromJSON`: that is the
        # one place `env` cannot reach, so the matrix is what fixes the format.
        description: >-
          JSON array of directories built into images, one per image, each holding a
          Dockerfile and a docker-bake.hcl. The repository each image publishes to is
          composed from the directory name - see the `images` step. A directory listed
          twice is refused, the name being both a matrix leg and an artifact. Images only;
          compose files are the input below.
        required: true
        type: string
      compose-directories:
        description: >-
          JSON array of directories published as OCI compose artifacts, one per directory,
          each holding a compose.yaml. The repository each publishes to is composed from
          the directory name exactly as an image's is, so a directory named `stack`
          publishes to <namespace>/<repository>-stack. THE NAME: the file's `name:` must
          equal <repository>-<directory>, and the directory must not be nested, so the
          project, its network and its volume are readable off the artifact's reference
          and two repositories cannot collide on one host. THE CONTRACT: this workflow sets
          IMAGE_PREFIX, to <namespace>/<repository>, and IMAGE_TAG, to the tag being
          published, and NAMES NOTHING ELSE. Every other variable the file interpolates is
          filled from the .env beside it where that file declares one, and with a
          placeholder where it does not, a host path being the deployment's to supply. A
          directory listed twice is refused. Empty by default, for a repository that
          publishes images alone.
        required: false
        default: "[]"
        type: string
      aws-region:
        description: >-
          The region the release role is assumed in and the Docker Hub PAT parameter is
          read from. Spelled as the `configure-aws-credentials` input it feeds, in `push`.
        required: true
        type: string
      aws-ssm-parameter:
        description: >-
          The SSM Parameter Store path holding the Docker Hub PAT `push` logs in with: a
          SecureString, read with --with-decryption. The release role's inline policy
          grants ssm:GetParameter on this one parameter's ARN as a literal rather than a
          prefix, so a path it does not name is refused - docs/releases.md
          explains why that literal is the whole isolation boundary. Not a secret: a path
          is an address, and the value it points at never leaves the step that reads it.
        required: true
        type: string
      dockerhub-namespace:
        description: >-
          The Docker Hub namespace every image publishes under, and the account `push`
          logs in as. Must be the account the PAT above belongs to, which nothing checks.
          Validated in the `images` step, which is also where it becomes half of each
          repository name.
        required: true
        type: string
    secrets:
      aws-role-arn:
        description: >-
          The IAM role `push` assumes with this workflow's OIDC token, as a full ARN. Its
          trust policy has to accept this workflow's job_workflow_ref claim and its inline
          policy has to grant ssm:GetParameter on the parameter above. A SECRET rather than
          an input so the account id inside it is masked - see the credential step.
        required: true

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: ${{ inputs.dockerhub-namespace }}

jobs:
  # Tags and labels derived ONCE, so no image and its metadata can disagree with another's.
  meta:
    runs-on: ubuntu-latest
    env:
      # Declared ONCE for both derivations below, so a release cannot tag a compose file
      # differently from the images that file names. A `with:` reads the `env` context,
      # which is what lets one declaration serve both; a YAML anchor would not. The semver
      # patterns resolve only on a tag ref, so a pull_request run yields the sha tag alone.
      TAG_PATTERNS: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,format=long
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
    outputs:
      image-tags: ${{ steps.meta-images.outputs.tags }}
      image-repositories: ${{ steps.images.outputs.image-map }}
      compose-tags: ${{ steps.meta-compose.outputs.tags }}
      compose-repositories: ${{ steps.images.outputs.compose-map }}
      image-prefix: ${{ steps.images.outputs.image-prefix }}
      bake-labels: ${{ steps.bake.outputs.labels }}
      bake-annotations: ${{ steps.bake.outputs.annotations }}
    steps:
      # THE IMAGE NAME IS COMPOSED HERE AND NOWHERE ELSE: <namespace>/<repository>-<dir>,
      # read back from `image-list` and `image-map` so no consumer can spell one differently.
      # `image-list` is comma-joined because metadata-action splits `images` on newlines only,
      # then CSV-parses each line. Single-line outputs for the reason the bake step gives.
      - name: Compose the repository each directory publishes to
        id: images
        env:
          IMAGE_DIRECTORIES: ${{ inputs.image-directories }}
          COMPOSE_DIRECTORIES: ${{ inputs.compose-directories }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # `required` is satisfied by a key being present, and an unset variable reaches
          # a called workflow as an empty string.
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::dockerhub-namespace must be lowercase letters, digits, - or _, got: '$DOCKERHUB_NAMESPACE'"
            exit 1
          fi
          printf '%s' "$IMAGE_DIRECTORIES" > /tmp/image-directories.json
          printf '%s' "$COMPOSE_DIRECTORIES" > /tmp/compose-directories.json
          # A string passes `length > 0` too, so the type is what is checked.
          if ! jq -e 'type == "array" and length > 0' /tmp/image-directories.json > /dev/null; then
            echo "::error::image-directories must be a non-empty JSON array, got: $IMAGE_DIRECTORIES"
            exit 1
          fi
          # Empty is legal here: a repository may publish images and no compose file.
          if ! jq -e 'type == "array"' /tmp/compose-directories.json > /dev/null; then
            echo "::error::compose-directories must be a JSON array, got: $COMPOSE_DIRECTORIES"
            exit 1
          fi
          # A repeat is not a no-op: image-directories drives a matrix, so two legs would race
          # on one artifact name, and the compose loop would publish one artifact twice.
          for file in /tmp/image-directories.json /tmp/compose-directories.json; do
            if ! jq -e 'length == (unique | length)' "$file" > /dev/null; then
              echo "::error::$(basename "$file" .json) repeats a directory:" \
                "$(jq -c '[group_by(.)[] | select(length > 1) | first]' "$file")"
              exit 1
            fi
          done
          # THE PREFIX, which every name below is built on and which `push` exports to
          # compose as IMAGE_PREFIX. A compose artifact is named by the same formula as an
          # image, so the two halves differ in nothing but which list they read.
          prefix="$DOCKERHUB_NAMESPACE/$REPOSITORY"
          printf 'image-prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"
          jq -r --arg p "$prefix" '[.[] | "\($p)-\(.)"] | join(",")' \
            /tmp/image-directories.json | sed 's/^/image-list=/' >> "$GITHUB_OUTPUT"
          jq -c --arg p "$prefix" 'map({key: ., value: "\($p)-\(.)"}) | from_entries' \
            /tmp/image-directories.json | sed 's/^/image-map=/' >> "$GITHUB_OUTPUT"
          jq -r --arg p "$prefix" '[.[] | "\($p)-\(.)"] | join(",")' \
            /tmp/compose-directories.json | sed 's/^/compose-list=/' >> "$GITHUB_OUTPUT"
          jq -c --arg p "$prefix" 'map({key: ., value: "\($p)-\(.)"}) | from_entries' \
            /tmp/compose-directories.json | sed 's/^/compose-map=/' >> "$GITHUB_OUTPUT"
          jq -r --arg p "$prefix" '.[] | "\(.) -> \($p)-\(.)"' \
            /tmp/image-directories.json /tmp/compose-directories.json

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-images
        with:
          # The target every directory's bake file declares; the action's own default is
          # `docker-metadata-action`, which no bake file declares.
          bake-target: image
          # Every image, so one derivation serves them all; `push` selects each image's
          # lines by its `<image>:` prefix.
          images: ${{ steps.images.outputs.image-list }}
          # Turns off the implicit "latest on any semver tag", so that tag is declared in
          # TAG_PATTERNS like every other. Both derivations need it.
          flavor: latest=false
          tags: ${{ env.TAG_PATTERNS }}

      # Derived SEPARATELY rather than as further names above: `push` diffs the
      # repositories the image artifacts carry against the ones the derived tags name, and
      # a compose file has no image artifact, so a name there would abort every release.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-compose
        if: inputs.compose-directories != '[]'
        with:
          images: ${{ steps.images.outputs.compose-list }}
          flavor: latest=false
          tags: ${{ env.TAG_PATTERNS }}

      # These files land in THIS runner's temp directory, so their contents travel rather
      # than their paths. ONE line each: a `<<` delimiter stops this file highlighting.
      - name: Carry the bake overrides to the build job
        id: bake
        env:
          LABELS_FILE: ${{ steps.meta-images.outputs.bake-file-labels }}
          ANNOTATIONS_FILE: ${{ steps.meta-images.outputs.bake-file-annotations }}
        run: |
          set -euo pipefail
          [ -s "$LABELS_FILE" ] && [ -s "$ANNOTATIONS_FILE" ]
          printf 'labels=%s\n' "$(tr -d '\n' < "$LABELS_FILE")" >> "$GITHUB_OUTPUT"
          printf 'annotations=%s\n' "$(tr -d '\n' < "$ANNOTATIONS_FILE")" >> "$GITHUB_OUTPUT"
          cat "$LABELS_FILE" "$ANNOTATIONS_FILE"

  # The untrusted job: it runs the repository's own build tooling, which `compose`, the
  # other job that checks out, does not. No `id-token` in either - see the header.
  build:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every image gets scanned even when one fails, so one run lists every finding.
      fail-fast: false
      matrix:
        # `strategy` reads `github`, `needs`, `vars` and `inputs` only, never `env`.
        directory: ${{ fromJSON(inputs.image-directories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A job holding repository code must not also hold a credential for it.
          persist-credentials: false

      # The release metadata, written back out as bake files the build step loads FIRST.
      - name: Stage the shared bake overrides
        env:
          LABELS: ${{ needs.meta.outputs.bake-labels }}
          ANNOTATIONS: ${{ needs.meta.outputs.bake-annotations }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bake
          printf '%s\n' "$LABELS" > /tmp/bake/labels.json
          printf '%s\n' "$ANNOTATIONS" > /tmp/bake/annotations.json

      # For the docker-container driver: attestations and the type=oci exporter are
      # BuildKit features the default docker driver does not implement.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the ${{ matrix.directory }} image
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          # What the directory's bake file, `poe image` and `pnpm run image` all pass.
          source: ${{ matrix.directory }}
          # ORDER IS LOAD-BEARING and nothing reports it: the last file wins the keys it
          # names, so the directory's own file goes last. CLAUDE.md states the pair.
          files: |
            /tmp/bake/labels.json
            /tmp/bake/annotations.json
            docker-bake.hcl
          targets: image
          # Exported, not pushed: the archive is what crosses into the job holding the
          # registry credential. `set` rather than declared in the bake file, because
          # where the artifact lands is this workflow's decision, not the directory's.
          set: |
            image.output=type=oci,dest=/tmp/image.oci.tar
          # Spelled out because `provenance: true` would leave BuildKit's own `mode=min`
          # in force. This publishes the whole GitHub event payload inside the image, which
          # docs/releases.md records as acceptable only while this repo is public.
          provenance: mode=max
          sbom: true

      # trivy reads an OCI layout directory and rejects the tarred one. `tar -xf` rather
      # than `regctl image import`: import leads index.json with a referrers index, trivy
      # reads the first entry only, and the scan then reports SUCCESS having found nothing.
      - name: Unpack the OCI layout
        run: |
          set -euo pipefail
          mkdir -p /tmp/oci
          tar -xf /tmp/image.oci.tar -C /tmp/oci

      - name: Scan the ${{ matrix.directory }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # `--skip-version-check`, which the action exposes no input for.
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: image
          input: /tmp/oci
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          format: json
          output: /tmp/trivy.json
          exit-code: 0

      # TWO assertions, because a passing trivy run does not mean THIS image was scanned:
      # identity first, then the findings. docs/releases.md covers the gate.
      - name: Gate on the scan
        env:
          DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail

          # The platform is what tells an image config from the empty `{}` the attestation
          # manifest also puts in this layout: `{}` declares none. The read is empty for a
          # blob that is absent, is not an image config, or declares neither half.
          config="$(jq -r '.Metadata.ImageID // ""' /tmp/trivy.json)"
          blob="/tmp/oci/blobs/sha256/${config#sha256:}"
          platform="$(jq -r '[.os, .architecture]
                             | if any(. == null) then "" else join("/") end' \
                         "$blob" 2>/dev/null || true)"
          if [ -z "$platform" ]; then
            echo "::error::trivy reported $config for the $DIRECTORY image, which is no image config in the layout it scanned, so it scanned something else."
            jq '{Metadata: .Metadata, Targets: [.Results[]?.Target]}' /tmp/trivy.json
            exit 1
          fi
          echo "scanned $DIRECTORY: $config ($platform)"

          findings="$(jq -r '.Results[]?.Vulnerabilities[]?
                             | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"' /tmp/trivy.json)"
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings"
            echo "::error::$(printf '%s\n' "$findings" | wc -l) HIGH or CRITICAL finding(s) in the $DIRECTORY image."
            exit 1
          fi
          echo "no HIGH or CRITICAL findings"

      # Both travel with the archive, so `push` needs no list of its own and can prove
      # nothing changed in transit.
      - name: Stage the archive, its digest and its repository
        env:
          # bake-action reports one entry per target rather than a bare digest.
          DIGEST: ${{ fromJSON(steps.build.outputs.metadata).image['containerimage.digest'] }}
          # Read back out of `meta`, not recomposed: the formula lives in one step.
          IMAGE: ${{ fromJSON(needs.meta.outputs.image-repositories)[matrix.directory] }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          mv /tmp/image.oci.tar /tmp/out/image.oci.tar
          printf '%s\n' "$DIGEST" > /tmp/out/digest
          printf '%s\n' "$IMAGE" > /tmp/out/repository
          cat /tmp/out/digest /tmp/out/repository

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.directory }}
          path: /tmp/out/
          retention-days: 1
          if-no-files-found: error

  # `push` checks nothing out, so this job checks every compose directory out on its
  # behalf - the second job running repository code, hence no `id-token: write`. It gates
  # the project name, the directory shape, undeclared variables, and that the file LOADS.
  # A LOOP RATHER THAN A MATRIX, and no `if:`: it builds nothing, and a job that always
  # runs never skips, which is what lets `push` keep the plain `needs` gate on empty input.
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A job holding repository code must not also hold a credential for it.
          persist-credentials: false

      - name: Validate and stage every compose directory
        env:
          COMPOSE_DIRECTORIES: ${{ inputs.compose-directories }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          docker compose version
          # Experimental when it was added, so a runner whose compose predates it would
          # otherwise fail a release at its very last step.
          docker compose publish --help > /dev/null
          mkdir -p /tmp/compose-files
          # ALWAYS written, empty input included, so the artifact is never empty.
          printf '%s' "$COMPOSE_DIRECTORIES" | jq -r '.[]' \
            > /tmp/compose-files/directories
          while read -r directory; do
            [ -n "$directory" ] || continue
            # Nested composes a three-component Hub repository, and a project name whose
            # silently stripped slash collides with the flat spelling.
            case "$directory" in */*)
              echo "::error::compose directory $directory must not be nested."
              exit 1 ;;
            esac
            # <repository>-<directory>, the formula the images and the artifact follow, so
            # a deployer reads the project, network and volume off the artifact reference.
            # The DECLARED key: `config .name` would show a COMPOSE_PROJECT_NAME override.
            expected="$REPOSITORY-$directory"
            declared="$(sed -n 's/^name:[[:space:]]*//p' "$directory/compose.yaml" \
              | head -1 | tr -d "\"' ")"
            if [ "$declared" != "$expected" ]; then
              echo "::error::$directory/compose.yaml names the project" \
                "'${declared:-nothing}', expected '$expected'."
              exit 1
            fi
            # The whole directory: the .env travels beside the file that needs it.
            mkdir -p "/tmp/compose-files/$directory"
            cp -R "$directory/." "/tmp/compose-files/$directory/"
            docker compose -f "$directory/compose.yaml" --profile '*' config --variables \
              --format json > /tmp/variables.json
            # A name with no `:?` renders a WRONG value when unset rather than failing.
            for name in $(jq -r 'to_entries[]
              | select(.value.Required | not) | .key' /tmp/variables.json); do
              grep -qE "^[[:space:]]*$name=" "$directory/.env" 2>/dev/null && continue
              echo "::error::$directory/compose.yaml leaves \$$name unguarded and" \
                "$directory/.env does not declare it."
              exit 1
            done
            # EVERY name, listed without resolving any, so this reads a file nothing can
            # render. `--env-file` turns .env auto-loading OFF and the later file wins, so
            # the directory's own declarations outrank these placeholders.
            jq -r 'keys[] | "\(.)=release-workflow-placeholder"' /tmp/variables.json \
              > "/tmp/compose-files/$directory/.placeholders.env"
            set -- --env-file "/tmp/compose-files/$directory/.placeholders.env"
            [ -f "$directory/.env" ] && set -- "$@" --env-file "$directory/.env"
            # `*` rather than a profile named here: a compose file's profiles are its
            # own business, and `config` renders only the services a profile selects.
            docker compose "$@" -f "$directory/compose.yaml" --profile '*' config --quiet
            echo "staged $directory"
          done < /tmp/compose-files/directories

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-files
          # Hidden files are excluded by default, which is exactly the .env files.
          path: /tmp/compose-files/
          include-hidden-files: true
          # The image archives' retention, for the same reason.
          retention-days: 1
          if-no-files-found: error

  # The trusted job. It checks nothing out: everything that runs in it is either a
  # SHA-pinned action or a `run` block written in this file.
  push:
    needs: [meta, build, compose]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one rather than merging, so
      # contents: read is restated deliberately.
      contents: read
      id-token: write
    steps:
      # FIRST, so a misconfigured caller fails before any credential handling begins. No
      # message echoes the value it rejected - the ARN's would print as `***` - so each
      # states the shape instead.
      - name: Check the release configuration
        env:
          AWS_REGION: ${{ inputs.aws-region }}
          AWS_ROLE_ARN: ${{ secrets.aws-role-arn }}
          AWS_SSM_PARAMETER: ${{ inputs.aws-ssm-parameter }}
        run: |
          set -euo pipefail
          if [[ ! "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::aws-region must match ^[a-z0-9-]+$"
            exit 1
          fi
          # The ARN form specifically: configure-aws-credentials accepts a bare role NAME
          # too, resolving it against the source account, and this rejects that.
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]]; then
            echo "::error::aws-role-arn must be an IAM role ARN, not a bare role name"
            exit 1
          fi
          if [[ ! "$AWS_SSM_PARAMETER" =~ ^/[A-Za-z0-9./_-]+$ ]]; then
            echo "::error::aws-ssm-parameter must be an absolute SSM parameter path"
            exit 1
          fi
          echo "region, role ARN and parameter path all well-formed"

      # The claims AWS conditions on, dumped before any AWS call, so a trust-policy
      # mismatch is diagnosable from this run. The only place the tag-shaped `sub` and
      # `job_workflow_ref` can be observed. Only the payload is decoded: the token itself
      # is a live credential and never reaches the log.
      - name: Show the OIDC token claims
        run: |
          set -euo pipefail
          token="$(curl -fsSL --proto '=https' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)"
          payload="$(echo "$token" | cut -d. -f2)"
          # base64url -> base64, then pad to a multiple of 4 so base64 -d accepts it.
          payload="${payload//-/+}"
          payload="${payload//_//}"
          while (( ${#payload} % 4 )); do payload+="="; done
          echo "$payload" | base64 -d | jq .

      # Untrusted bytes, safe here because nothing in this job executes them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose-files
          path: /tmp/compose-files

      # BEFORE regctl-installer, and load-bearing: that installer verifies its download
      # against regclient's cosign signature only `if [ -x "$(command -v cosign)" ]`.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          # Pinned, not the action's `latest`: this binary runs while the credential is live.
          release: v0.11.7

      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A SECRET, because the runner echoes this `with:` block into the log before the
          # action runs: an input would publish the account id on every release.
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: ${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          # Not redundant with the ARN masked: this covers what STS RETURNS.
          mask-aws-account-id: true
          # The credentials become step outputs instead of job environment, so a step that
          # needs them has to name them and the rest never see them.
          output-credentials: true
          output-env-credentials: false

      # The only step that touches the PAT, piped straight from SSM into `docker login`,
      # so it occupies no variable, output or file. regctl and cosign read what that wrote.
      - name: Read the Docker Hub PAT and log in
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          # Through `env` rather than the command text, which is a pipeline: a variable is
          # quoted once and cannot alter its shape.
          AWS_SSM_PARAMETER: ${{ inputs.aws-ssm-parameter }}
        run: |
          set -euo pipefail
          aws ssm get-parameter \
            --name "$AWS_SSM_PARAMETER" \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            | docker login docker.io --username "$DOCKERHUB_NAMESPACE" --password-stdin

      # All of them BEFORE any is copied, so an altered archive fails the release with
      # nothing published rather than half of it. The artifacts are what say which images
      # exist; no step in this job names a directory or a repository.
      - name: Stage every image and verify its digest
        env:
          TAGS: ${{ needs.meta.outputs.image-tags }}
        run: |
          set -euo pipefail

          # The glob below iterates its own literal text when nothing matches, so the
          # count is checked rather than assumed.
          set -- /tmp/images/image-*/
          if [ ! -d "$1" ]; then
            echo "::error::no image artifacts were downloaded, so there is nothing to publish."
            exit 1
          fi
          echo "$# image artifact(s) downloaded"

          for dir in /tmp/images/image-*/; do
            directory="${dir%/}"; directory="${directory##*/image-}"
            expected="$(cat "$dir/digest")"
            regctl image import "ocidir:///tmp/staged/$directory:staged" "$dir/image.oci.tar"
            actual="$(regctl manifest digest "ocidir:///tmp/staged/$directory:staged")"
            echo "$directory: $(cat "$dir/repository"), built $expected, staged $actual"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$directory digest changed between build and push."
              exit 1
            fi
          done

          # Both sides come from `meta`'s one composition step, so what this catches is a
          # count that disagrees - a build that uploaded nothing, an artifact that arrived
          # twice - either of which would publish a partial release quietly.
          cat /tmp/images/image-*/repository | sort -u > /tmp/staged-repositories
          printf '%s\n' "$TAGS" | sed -n 's/:[^:/]*$//p' \
            | sort -u > /tmp/tagged-repositories
          if ! diff -u /tmp/staged-repositories /tmp/tagged-repositories; then
            echo "::error::the images staged and the images the tags name are not the same set."
            exit 1
          fi

      # regctl copies the index byte for byte, which is what keeps ONE digest across the
      # scan, the push, the attestations and the signature, and it reads a local layout
      # where `docker buildx imagetools create` reads sources already in a registry.
      - name: Copy every image to Docker Hub
        env:
          TAGS: ${{ needs.meta.outputs.image-tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" > /tmp/tags
          for dir in /tmp/images/image-*/; do
            directory="${dir%/}"; directory="${directory##*/image-}"
            image="$(cat "$dir/repository")"
            matched=0
            while read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in "$image:"*) ;; *) continue ;; esac
              echo "copying $directory -> $ref"
              regctl image copy "ocidir:///tmp/staged/$directory:staged" "$ref"
              matched=$((matched + 1))
            done < /tmp/tags
            echo "$directory: $matched tag(s) published"
          done

      # AFTER the copy above, which is why this step lives in this job at all:
      # --resolve-image-digests reads each digest back OUT of the registry. ONE PUBLISH PER
      # TAG, each resolving against that tag's own images, and docs/releases.md says what
      # the artifact ends up holding. IMAGE_PREFIX and IMAGE_TAG are THE ONLY TWO NAMES
      # THIS WORKFLOW PUTS INTO A COMPOSE FILE: the shell environment outranks both files
      # below: the placeholders the `compose` job staged, and the directory's own .env.
      - name: Publish every compose file to Docker Hub
        env:
          COMPOSE_TAGS: ${{ needs.meta.outputs.compose-tags }}
          COMPOSE_REPOSITORIES: ${{ needs.meta.outputs.compose-repositories }}
          # Read back out of `meta` rather than recomposed here.
          IMAGE_PREFIX: ${{ needs.meta.outputs.image-prefix }}
        run: |
          set -euo pipefail
          export IMAGE_PREFIX
          printf '%s\n' "$COMPOSE_TAGS" > /tmp/compose-tags
          : > /tmp/compose-digests
          files=0
          published=0
          # The manifest the `compose` job staged: a list, not a glob, and an empty
          # one is a release with no compose file rather than a failure.
          while read -r directory; do
            [ -n "$directory" ] || continue
            files=$((files + 1))
            repository="$(printf '%s' "$COMPOSE_REPOSITORIES" \
              | jq -r --arg d "$directory" '.[$d] // empty')"
            if [ -z "$repository" ]; then
              echo "::error::no repository was composed for $directory."
              exit 1
            fi
            last=""
            while read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in "$repository:"*) ;; *) continue ;; esac
              # The repository holds no port, so the last colon is the tag's.
              export IMAGE_TAG="${ref##*:}"
              echo "publishing $directory -> $ref, naming images at :$IMAGE_TAG"
              set -- --env-file "/tmp/compose-files/$directory/.placeholders.env"
              if [ -f "/tmp/compose-files/$directory/.env" ]; then
                set -- "$@" --env-file "/tmp/compose-files/$directory/.env"
              fi
              docker compose "$@" -f "/tmp/compose-files/$directory/compose.yaml" \
                publish "$ref" --resolve-image-digests --yes < /dev/null
              published=$((published + 1))
              last="$ref"
            done < /tmp/compose-tags
            # A derivation that yielded nothing would otherwise leave the images
            # published and no compose file describing them.
            if [ -z "$last" ]; then
              echo "::error::no tag was derived for $directory, so it was not published."
              exit 1
            fi
            # Read back from the registry: the signature below covers content, not a name.
            printf '%s@%s\n' "$repository" "$(regctl manifest digest "$last")" \
              >> /tmp/compose-digests
          done < /tmp/compose-files/directories
          echo "$files compose file(s), $published tag(s) published"
          cat /tmp/compose-digests

      # Keyless, reusing this job's own OIDC token. The digest is the index's, so one
      # signature covers the image and its attestations.
      - name: Sign every published digest
        run: |
          set -euo pipefail
          for dir in /tmp/images/image-*/; do
            cosign sign --yes "$(cat "$dir/repository")@$(cat "$dir/digest")"
          done
          # cosign signs a digest, so the artifact's media type is nothing it has to know.
          # Empty when no compose directory was given.
          while read -r ref; do
            [ -n "$ref" ] || continue
            cosign sign --yes "$ref"
          done < /tmp/compose-digests

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io
