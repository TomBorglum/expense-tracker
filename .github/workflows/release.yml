name: Release

# Builds, scans and publishes one image per directory it is given, then publishes
# compose.yaml as an OCI artifact naming those images by digest. publish.yml is what names
# the directories, everything else specific to one repository, and the triggers: this file
# is CALLED, never triggered, and that file's header says why it keeps the name it has.
#
# Publishes to Docker Hub when release-please's GitHub Release is published, and exercises
# the build half on any pull request that changes what goes into an image or the stack.
#
# THE ISOLATION PROPERTY THIS FILE EXISTS TO HOLD. `build` runs repository code - a
# Dockerfile, `pixi install`, `pnpm install` - and holds the Docker Hub credential at
# arm's length: neither it nor `compose`, the two jobs that check the repository out, has
# `id-token: write`, which is what the AWS exchange needs. `push` holds the credential and
# checks nothing out. So a malicious dependency pulled into either install step lands in
# the job without that token. CLAUDE.md states this as an invariant.
#
# Docker Hub supports no OIDC for personal accounts, so the push credential is a PAT read
# from AWS SSM Parameter Store through a role assumed with the GitHub OIDC token.
# oidc-smoke-test.yml exercises that path; README.md, under Releases, documents the AWS
# objects and how to recreate them.
#
# This repository is public, so every line of these logs is world-readable. Nothing here
# may print the account id or the PAT, and anything added must be masked on the same terms.

# The caller's triggers reach this file through the `github` context, which in a called
# workflow is always the CALLER's: `github.event_name` below reads publish.yml's event,
# and metadata-action reads `github.ref` itself, which is what resolves the semver
# patterns. Nothing here reads `github.event.repository` - the repository arrives as an
# input, so the name this file composes stays the caller's to decide.
#
# publish.yml carries the concurrency group, because GitHub cancels the caller when caller
# and called share one. A RELEASE is never cancelled: a run stopped partway through the
# push job can leave one image published and the other not, which is worse than a slow
# queue. A pull request has nothing to leave half-done - it never reaches `push`.
on:
  workflow_call:
    inputs:
      directories:
        # A JSON array, because `strategy` below reads it through `fromJSON`: that is the
        # one place `env` cannot reach, so the matrix is what fixes the format.
        description: >-
          JSON array of directories to build, one per image, each holding a Dockerfile and
          a docker-bake.hcl. The repository each image publishes to is composed from the
          directory name - see the `images` step.
        required: true
        type: string
      namespace:
        description: >-
          The Docker Hub namespace every image publishes under, and the account `push`
          logs in as. Validated in the `images` step, which is also where it becomes half
          of each repository name.
        required: true
        type: string
      repository:
        description: >-
          The repository half of every image name, between the namespace and the
          directory. An input rather than a read of the caller's own repository, so this
          file composes a published name without knowing whose it is: a caller passing
          `github.event.repository.name` gets names that follow a repository rename, and
          one passing a literal gets names that do not. Validated in the `images` step on
          the namespace's terms.
        required: true
        type: string
      aws-region:
        description: >-
          The region holding both the role below and the parameter below that. Read by the
          credential exchange and by the parameter read, which are the only two AWS calls
          this workflow makes.
        required: true
        type: string
      aws-role-arn:
        description: >-
          The role `push` assumes with its OIDC token. It needs a trust policy that accepts
          this workflow's claims and a policy granting the parameter read below. An ARN is
          an address rather than a secret, so it travels as an input and reaches the log:
          what bounds it is the trust policy, not its obscurity. The account id inside it
          is masked before the exchange.
        required: true
        type: string
      pat-parameter-name:
        description: >-
          SSM Parameter Store path holding the registry password, a SecureString read with
          --with-decryption and piped straight into `docker login`. The role above has to
          grant `ssm:GetParameter` on it, which is what bounds a caller to its own.
        required: true
        type: string
      role-session-name:
        description: >-
          Names the assumed-role session in CloudTrail and in the credential step's log. A
          label only - the trust policy conditions on `sub` and `job_workflow_ref` and
          never on this - so the default suits any caller, and one wanting its runs told
          apart passes its own.
        required: false
        default: release
        type: string

permissions:
  contents: read

env:
  # The Docker Hub namespace half of every image name, and the account `push` logs in as.
  # The caller's, so this file carries nothing specific to one account. Step-level `env`
  # merges onto this rather than replacing it, which is what lets both readers name it.
  NAMESPACE: ${{ inputs.namespace }}

jobs:
  # Tags and labels derived ONCE, so no image and its metadata can disagree with another's.
  # Needs no checkout - metadata-action reads the event context, not the working tree.
  meta:
    runs-on: ubuntu-latest
    env:
      # The tags, declared ONCE for the two derivations below - the images' and the
      # compose artifact's - so a release cannot tag the stack differently from the images
      # that stack names. A step's `with:` can read the `env` context, which is what lets
      # one declaration serve both; a YAML anchor would not, GitHub resolving none.
      #
      # The semver patterns resolve only on a tag ref, so a pull_request run yields the
      # sha tag alone - which is all the build half needs, since it never pushes.
      TAG_PATTERNS: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha,format=long
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
    outputs:
      # Two halves on the same terms, each a pair: what to tag, and where it goes. The
      # bake overrides have no second half - there is no bake file for an artifact that
      # nothing builds.
      image-tags: ${{ steps.meta-images.outputs.tags }}
      image-repositories: ${{ steps.images.outputs.map }}
      compose-tags: ${{ steps.meta-compose.outputs.tags }}
      compose-repository: ${{ steps.images.outputs.compose }}
      bake-labels: ${{ steps.bake.outputs.labels }}
      bake-annotations: ${{ steps.bake.outputs.annotations }}
    steps:
      # THE IMAGE NAME IS COMPOSED HERE AND NOWHERE ELSE: <namespace>/<repository>-<dir>.
      # Both consumers read it back out of this step - metadata-action below from `list`,
      # the build job from `map` - so the two cannot spell a repository differently.
      #
      # BOTH halves of the name are the caller's, passed in rather than read off
      # `github.event.repository`, so nothing here is tied to one repository. publish.yml
      # is where the repository is chosen, and CLAUDE.md records what choosing it decides.
      #
      # Two single-line outputs, no heredoc, for the reason the bake step below gives.
      # `list` is comma-joined: metadata-action splits its `images` input on newlines
      # only, then CSV-parses each line, and a single line whose fields all lack `=` is
      # read as plain names. Its log group names what it parsed, so a PR run shows it.
      - name: Compose the repository each directory publishes to
        id: images
        env:
          DIRECTORIES: ${{ inputs.directories }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          # Checked rather than trusted: `required` is satisfied by a key being present,
          # and an unset repository variable reaches a called workflow as an empty string,
          # which would otherwise compose a name `docker login` cannot push to.
          if [[ ! "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::namespace must be lowercase letters, digits, - or _, got: '$NAMESPACE'"
            exit 1
          fi
          # The other half, which needed no check while a GitHub context supplied it. A
          # repository name GitHub accepts can carry uppercase, and that pushes nowhere.
          if [[ ! "$REPOSITORY" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::repository must be lowercase letters, digits, ., - or _, got: '$REPOSITORY'"
            exit 1
          fi
          printf '%s' "$DIRECTORIES" > /tmp/directories.json
          # A string passes `length > 0` too, so the type is what is checked.
          if ! jq -e 'type == "array" and length > 0' /tmp/directories.json > /dev/null; then
            echo "::error::directories must be a non-empty JSON array, got: $DIRECTORIES"
            exit 1
          fi
          jq -r --arg ns "$NAMESPACE" --arg repo "$REPOSITORY" \
            '[.[] | "\($ns)/\($repo)-\(.)"] | join(",")' \
            /tmp/directories.json | sed 's/^/list=/' >> "$GITHUB_OUTPUT"
          jq -c --arg ns "$NAMESPACE" --arg repo "$REPOSITORY" \
            'map({key: ., value: "\($ns)/\($repo)-\(.)"}) | from_entries' \
            /tmp/directories.json | sed 's/^/map=/' >> "$GITHUB_OUTPUT"
          # The compose artifact's repository: the same pair WITHOUT a directory suffix,
          # because the stack is not an image and no directory builds it. Composed here
          # with the rest so the formula stays in one step, and read back by the second
          # derivation below and by the publish step in `push`.
          printf 'compose=%s/%s\n' "$NAMESPACE" "$REPOSITORY" >> "$GITHUB_OUTPUT"
          jq -r --arg ns "$NAMESPACE" --arg repo "$REPOSITORY" \
            '.[] | "\(.) -> \($ns)/\($repo)-\(.)"' /tmp/directories.json
          echo "compose -> $NAMESPACE/$REPOSITORY"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-images
        with:
          # The target every directory's bake file declares, so the generated overrides
          # land on it. The action's own default target is `docker-metadata-action`, which
          # no bake file declares.
          bake-target: image
          # Every image, so one derivation serves them all; the push job selects the lines
          # belonging to each by its `<image>:` prefix. Composed above rather than written
          # here, which is what lets a caller name the directories and nothing else.
          images: ${{ steps.images.outputs.list }}
          # latest=false turns off the implicit "latest on any semver tag", so the moving
          # tag is declared in TAG_PATTERNS above like every other one rather than
          # appearing by default. Both derivations need it, for the same reason.
          flavor: latest=false
          tags: ${{ env.TAG_PATTERNS }}

      # The compose artifact's tags, derived SEPARATELY rather than by handing the step
      # above a fourth name. ONE reason, and it is in `push`: before copying anything it
      # diffs the repositories the image artifacts carry against the repositories the
      # derived tags name, and the stack has no artifact because nothing builds it - so a
      # fourth name there fails that check and aborts every release. The copy loop would
      # skip those refs anyway, iterating artifacts rather than tags.
      #
      # `bake-target` is absent below because nothing bakes a compose file, not because
      # sharing the step would break it: only the label and annotation bake files travel
      # from here, and neither names an image.
      #
      # The patterns are shared, so the two derivations still cannot disagree on a tag.
      # `flavor` is the one input still restated, and the reason is the same as above's.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta-compose
        with:
          images: ${{ steps.images.outputs.compose }}
          flavor: latest=false
          tags: ${{ env.TAG_PATTERNS }}

      # metadata-action writes these bake files into THIS runner's temp directory, so
      # their paths mean nothing in the build job - the contents travel instead. One
      # derivation for every image is what this job exists for: it gives them a single
      # `created` stamp.
      #
      # Each file goes onto ONE line, which is what keeps the output off the multi-line
      # form: that form needs a `<<` delimiter, and GitHub's web UI reads the `<<` as a
      # heredoc opener and stops highlighting the rest of this file there. JSON ignores
      # whitespace between tokens and escapes a newline inside a string, so dropping the
      # newlines cannot change what either file says.
      - name: Carry the bake overrides to the build job
        id: bake
        env:
          LABELS_FILE: ${{ steps.meta-images.outputs.bake-file-labels }}
          ANNOTATIONS_FILE: ${{ steps.meta-images.outputs.bake-file-annotations }}
        run: |
          set -euo pipefail
          [ -s "$LABELS_FILE" ] && [ -s "$ANNOTATIONS_FILE" ]
          printf 'labels=%s\n' "$(tr -d '\n' < "$LABELS_FILE")" >> "$GITHUB_OUTPUT"
          printf 'annotations=%s\n' "$(tr -d '\n' < "$ANNOTATIONS_FILE")" >> "$GITHUB_OUTPUT"
          cat "$LABELS_FILE" "$ANNOTATIONS_FILE"

  # The untrusted job: it runs the repository's own build tooling, which `compose`, the
  # other job that checks out, does not. No `id-token` in either - see the header.
  build:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Every image gets scanned even when one fails, so one run lists every finding.
      fail-fast: false
      matrix:
        # One job per directory the caller named. `strategy` is the one key `env` cannot
        # reach - it reads `github`, `needs`, `vars` and `inputs` only - which is why the
        # input is JSON rather than the newline list metadata-action wants.
        directory: ${{ fromJSON(inputs.directories) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to git again, and a job holding repository code must not
          # also hold a credential for the repository.
          persist-credentials: false

      # The release metadata, written back out as a pair of bake files beside the stack's
      # own. The build step below loads these FIRST and the stack's file LAST.
      - name: Stage the shared bake overrides
        env:
          LABELS: ${{ needs.meta.outputs.bake-labels }}
          ANNOTATIONS: ${{ needs.meta.outputs.bake-annotations }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bake
          printf '%s\n' "$LABELS" > /tmp/bake/labels.json
          printf '%s\n' "$ANNOTATIONS" > /tmp/bake/annotations.json

      # The docker-container driver, not the default docker one: attestations and the
      # type=oci exporter are BuildKit features the docker driver does not implement.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the ${{ matrix.directory }} image
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          # The directory the caller named, which is what its bake file's `context` and
          # `dockerfile` are written against - bake resolves `context` relative to the
          # working directory and `dockerfile` relative to the context, exactly as
          # `docker build` does. This is what `poe image` and `pnpm run image` pass too.
          source: ${{ matrix.directory }}
          # ORDER IS LOAD-BEARING, and nothing reports it. bake merges `labels` per key
          # and appends `annotations`, so the file loaded last wins the keys it names and
          # inherits the rest: the shared release metadata first, the stack's own
          # description and title last, which is what puts the stack's pair on the image.
          files: |
            /tmp/bake/labels.json
            /tmp/bake/annotations.json
            docker-bake.hcl
          targets: image
          # Exported, not pushed. This job must not hold registry credentials, and the
          # archive is what crosses into the job that does. It is `set` rather than
          # declared in the bake file: where the artifact lands is this workflow's
          # decision, not the stack's.
          #
          # No platform is declared here, and README.md, under Releases, says what holds
          # the published architecture to x86-64 instead.
          #
          # No `allow` input is needed even though the context leaves the stack directory:
          # bake-action passes `--allow fs=*` itself for buildx >= 0.18. A local
          # `docker buildx bake` has to pass `--allow=fs.read=..`, which is why the two
          # `image` tasks carry it.
          set: |
            image.output=type=oci,dest=/tmp/image.oci.tar
          # `mode=max` spelled out, which is what this records: given `provenance: true`
          # the action emits `--attest type=provenance,builder-id=...` and leaves
          # BuildKit's own `mode=min` in force, below what the action defaults to for a
          # public repository with the input omitted entirely.
          #
          # What mode=max ALSO does, found by reading the first run's output rather than
          # assumed: it records the entire GitHub event payload under
          # `buildDefinition.internalParameters.github_event_payload` - on a pull request
          # that is 6 kB of a 52 kB predicate, pull request body included - and that is
          # published inside the image. It is acceptable here only because this repository
          # is public, so the payload carries nothing that is not already public.
          # `mode=min` is the one-line change if that ever stops being true.
          provenance: mode=max
          sbom: true

      # trivy reads an OCI *layout directory* and rejects the archive outright - "stat
      # image.oci.tar/index.json: not a directory". An OCI archive is a tarred layout, so
      # unpacking is the whole conversion.
      #
      # `tar -xf` rather than `regctl image import`: import writes a layout whose
      # index.json leads with a referrers index, trivy reads the first entry only, and the
      # scan then finds nothing and reports SUCCESS. The gate below is what reports that.
      - name: Unpack the OCI layout
        run: |
          set -euo pipefail
          mkdir -p /tmp/oci
          tar -xf /tmp/image.oci.tar -C /tmp/oci

      - name: Scan the ${{ matrix.directory }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: /tmp/oci
          scanners: vuln
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          format: json
          output: /tmp/trivy.json
          # The gate is the next step, which reads the report: it lists every finding and
          # checks that this image is what was scanned.
          exit-code: 0

      # TWO assertions, because a passing trivy run does not mean THIS image was scanned.
      # Pointed at a layout whose index.json does not lead to the image, trivy resolves the
      # empty config `{}`, reports no findings and exits 0 - so the first assertion is
      # identity: what trivy says it scanned has to be a config present in this layout
      # that declares a platform. The platform is what it reads rather than an OS family,
      # so a legitimately clean image passes whatever package database its base carries.
      - name: Gate on the scan
        env:
          DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail

          # trivy's own claim, checked against the layout rather than the layout walked to
          # work out what it should have claimed: the empty config sits in the layout too,
          # beside the image, as the attestation manifest's, so a walk that could reach it
          # compares one empty value with another. What tells them apart is the platform:
          # `{}` declares none, and an image config always declares both halves of one.
          # The read is empty for a blob that is absent, is not an image config, or
          # declares neither.
          config="$(jq -r '.Metadata.ImageID // ""' /tmp/trivy.json)"
          blob="/tmp/oci/blobs/sha256/${config#sha256:}"
          platform="$(jq -r '[.os, .architecture]
                             | if any(. == null) then "" else join("/") end' \
                         "$blob" 2>/dev/null || true)"
          if [ -z "$platform" ]; then
            echo "::error::trivy reported $config for the $DIRECTORY image, which is no image config in the layout it scanned, so it scanned something else."
            jq '{Metadata: .Metadata, Targets: [.Results[]?.Target]}' /tmp/trivy.json
            exit 1
          fi
          echo "scanned $DIRECTORY: $config ($platform)"

          findings="$(jq -r '.Results[]?.Vulnerabilities[]?
                             | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"' /tmp/trivy.json)"
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings"
            echo "::error::$(printf '%s\n' "$findings" | wc -l) HIGH or CRITICAL finding(s) in the $DIRECTORY image."
            exit 1
          fi
          echo "no HIGH or CRITICAL findings"

      # The digest travels with the archive so the push job can prove nothing changed in
      # transit, rather than that being read off two logs by eye. The repository travels
      # with it for the same reason: so the job that publishes needs no list of its own to
      # join the archives against.
      - name: Stage the archive, its digest and its repository
        env:
          # bake-action reports one entry per target rather than a bare digest.
          DIGEST: ${{ fromJSON(steps.build.outputs.metadata).image['containerimage.digest'] }}
          # Read back out of `meta`, not recomposed: the formula lives in one step.
          IMAGE: ${{ fromJSON(needs.meta.outputs.image-repositories)[matrix.directory] }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          mv /tmp/image.oci.tar /tmp/out/image.oci.tar
          printf '%s\n' "$DIGEST" > /tmp/out/digest
          printf '%s\n' "$IMAGE" > /tmp/out/repository
          cat /tmp/out/digest /tmp/out/repository

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.directory }}
          path: /tmp/out/
          # Long enough to inspect a failed release, short enough not to accumulate.
          retention-days: 1
          if-no-files-found: error

  # The stack itself, carried to `push` the only way it can be. `push` holds the Docker
  # Hub credential and checks nothing out, so something else has to check compose.yaml out
  # on its behalf - and that makes this the second job running repository code, so it gets
  # `contents: read` and NO `id-token: write`, the invariant the header states. An
  # artifact is the handover for the same reason the image archives are.
  #
  # It is also the only gate on compose.yaml anywhere: ci.yml never reads that file, so
  # without this job a file that fails to load would be found by a release.
  compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to git again, and a job holding repository code must not
          # also hold a credential for the repository.
          persist-credentials: false

      - name: Validate the compose file
        run: |
          set -euo pipefail
          docker compose version
          # `publish` was an experimental command when it was added, so a runner whose
          # compose predates it would fail a release at its very last step. Asserted here,
          # where a pull request reports it, rather than on the tag.
          docker compose publish --help > /dev/null
          # Loaded with every variable unset, which is what proves each `${...}` in the
          # file carries a default: a bare one resolves to an EMPTY bind source, which
          # compose rejects. Both profiles, because `config` renders only the services a
          # profile selects and the two loaders are the services with mounts.
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile load config --quiet

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose
          path: compose.yaml
          # The image archives' retention, for the same reason.
          retention-days: 1
          if-no-files-found: error

  # The trusted job. It checks nothing out: everything that runs in it is either a
  # SHA-pinned action or a `run` block written in this file.
  push:
    needs: [meta, build, compose]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block replaces the workflow-level one outright rather
      # than merging with it, so contents: read is restated here deliberately - the same
      # note oidc-smoke-test.yml carries.
      contents: read
      id-token: write
    steps:
      # The claims AWS conditions on, dumped before any AWS call, so a trust-policy
      # mismatch is diagnosable from this run rather than from a bare "Not authorized to
      # perform sts:AssumeRoleWithWebIdentity". This is also the only place the
      # tag-shaped `sub` and `job_workflow_ref` can be observed: the smoke test runs on
      # workflow_dispatch from a branch, so its claims are branch-shaped.
      #
      # Only the payload is decoded. The token itself is a live credential for its few
      # minutes of life and never reaches the log.
      - name: Show the OIDC token claims
        run: |
          set -euo pipefail
          token="$(curl -fsSL --proto '=https' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)"
          payload="$(echo "$token" | cut -d. -f2)"
          # base64url -> base64, then pad to a multiple of 4 so base64 -d accepts it.
          payload="${payload//-/+}"
          payload="${payload//_//}"
          while (( ${#payload} % 4 )); do payload+="="; done
          echo "$payload" | base64 -d | jq .

      # Untrusted bytes, and safe here precisely because nothing in this job executes
      # them - they are copied to a registry and never run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images

      # Published last, downloaded here, and never executed either - compose reads this
      # file, and the only thing it does with it is upload it again.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: /tmp/compose

      # BEFORE regctl-installer, and that order is load-bearing rather than tidy: the
      # regctl installer verifies the binary it downloads against regclient's cosign
      # signature `if [ -x "$(command -v cosign)" ]`, so cosign already being on PATH is
      # what runs that check. The signing step below needs cosign anyway.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          # Pinned rather than the action's `latest` default: this binary copies images
          # into a registry while the Docker Hub credential is live in the job.
          release: v0.11.7

      # BEFORE the step below, which prints the ARN holding this id as it expands its
      # `with:` block. An input carries no redaction of its own - that is the one thing a
      # secret is for - and mask-aws-account-id only takes effect once the action is
      # running, so this is what covers the ARN's own appearance in a world-readable log.
      - name: Mask the AWS account id
        env:
          ROLE_ARN: ${{ inputs.aws-role-arn }}
        run: |
          set -euo pipefail
          # Field 5 of arn:aws:iam::<account-id>:role/<name>.
          account="$(printf '%s' "$ROLE_ARN" | cut -d: -f5)"
          if [ -n "$account" ]; then
            echo "::add-mask::$account"
          fi

      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # An input, not a secret: a role ARN is an address, assuming it needs an OIDC
          # token this trust policy accepts, and keeping it in the log is what makes a
          # refused exchange diagnosable. Keeping it out of a world-readable FILE is the
          # caller's half; the account id inside it is masked by the step above and by
          # mask-aws-account-id below.
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: ${{ inputs.role-session-name }}
          # Short enough that a leaked credential outlives little, long enough for two
          # image pushes and their signatures.
          role-duration-seconds: 900
          mask-aws-account-id: true
          # The whole point of this pair: the credentials become step outputs and are
          # NOT written into the job environment, so every later step that needs them
          # has to name them and the ones that do not never see them.
          output-credentials: true
          output-env-credentials: false

      # The only step that touches the PAT. It is piped straight from SSM into
      # `docker login`, so it never occupies a shell variable, a step output or a file,
      # and every step after this one needs no secret at all - regctl and cosign both
      # read the credential `docker login` wrote to ~/.docker/config.json.
      - name: Read the Docker Hub PAT and log in
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          AWS_REGION: ${{ inputs.aws-region }}
          PARAMETER_NAME: ${{ inputs.pat-parameter-name }}
        run: |
          set -euo pipefail
          aws ssm get-parameter \
            --name "$PARAMETER_NAME" \
            --with-decryption \
            --query Parameter.Value \
            --output text \
            | docker login docker.io --username "$NAMESPACE" --password-stdin

      # Every image is staged and checked BEFORE any is copied, so a malformed or altered
      # archive fails the release with nothing published rather than half of it. No step
      # in this job names a directory or a repository: the artifacts are what say which
      # images exist, and each carries the repository its build job was given.
      - name: Stage every image and verify its digest
        env:
          TAGS: ${{ needs.meta.outputs.image-tags }}
        run: |
          set -euo pipefail

          # The glob below iterates its own literal text when nothing matches, so the
          # count is checked rather than assumed.
          set -- /tmp/images/image-*/
          if [ ! -d "$1" ]; then
            echo "::error::no image artifacts were downloaded, so there is nothing to publish."
            exit 1
          fi
          echo "$# image artifact(s) downloaded"

          for dir in /tmp/images/image-*/; do
            directory="${dir%/}"; directory="${directory##*/image-}"
            expected="$(cat "$dir/digest")"
            regctl image import "ocidir:///tmp/staged/$directory:staged" "$dir/image.oci.tar"
            actual="$(regctl manifest digest "ocidir:///tmp/staged/$directory:staged")"
            echo "$directory: $(cat "$dir/repository"), built $expected, staged $actual"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$directory digest changed between build and push."
              exit 1
            fi
          done

          # The repositories the artifacts carry against the repositories the derived
          # tags name. Both now come from `meta`'s one composition step, so they cannot
          # spell a repository differently; what this still catches is a count that does
          # not match - a build that uploaded nothing, an artifact that reached this job
          # twice - either of which would otherwise publish a partial release quietly.
          cat /tmp/images/image-*/repository | sort -u > /tmp/staged-repositories
          printf '%s\n' "$TAGS" | sed -n 's/:[^:/]*$//p' \
            | sort -u > /tmp/tagged-repositories
          if ! diff -u /tmp/staged-repositories /tmp/tagged-repositories; then
            echo "::error::the images staged and the images the tags name are not the same set."
            exit 1
          fi

      # regctl copies the index byte for byte, which is what keeps ONE digest across the
      # scan, the push, the attestations and the signature, and carries the index's
      # attestations with it. It reads the local OCI layout staged above, where
      # `docker buildx imagetools create` reads sources already in a registry.
      - name: Copy every image to Docker Hub
        env:
          TAGS: ${{ needs.meta.outputs.image-tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" > /tmp/tags
          for dir in /tmp/images/image-*/; do
            directory="${dir%/}"; directory="${directory##*/image-}"
            image="$(cat "$dir/repository")"
            matched=0
            while read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in "$image:"*) ;; *) continue ;; esac
              echo "copying $directory -> $ref"
              regctl image copy "ocidir:///tmp/staged/$directory:staged" "$ref"
              matched=$((matched + 1))
            done < /tmp/tags
            echo "$directory: $matched tag(s) published"
          done

      # The stack itself, to <namespace>/<repository> - the image repositories without a
      # directory suffix. AFTER the copy above, and that order is the whole reason this
      # step lives in this job rather than one of its own: --resolve-image-digests reads
      # each digest back OUT of the registry, so the images have to be there already.
      #
      # ONE PUBLISH PER TAG, each resolving against that tag's own images, so the
      # artifact tagged 2.1.0 names the images tagged 2.1.0. Every tag resolves to the
      # same digests; what differs is only the text the document carries beside them.
      #
      # What the artifact holds was measured against a throwaway registry rather than
      # assumed: compose.yaml BYTE FOR BYTE, comments and all, plus a second layer named
      # image-digests.yaml restating all five `image:` keys as `<tag>@sha256:...`. That
      # overlay is merged last, so NEITHER variable below has any effect on a deployment
      # that loads the artifact - they exist to tell this step what to resolve.
      - name: Publish the stack to Docker Hub
        id: compose
        env:
          COMPOSE_TAGS: ${{ needs.meta.outputs.compose-tags }}
          # The prefix compose.yaml's five `image:` keys compose against, which is the
          # namespace and repository the images themselves carry - read back out of `meta`
          # rather than recomposed here.
          EXPENSE_TRACKER_IMAGE_PREFIX: ${{ needs.meta.outputs.compose-repository }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COMPOSE_TAGS" > /tmp/compose-tags
          published=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            # The repository holds no port, so the last colon is the tag's.
            export EXPENSE_TRACKER_VERSION="${ref##*:}"
            echo "publishing the stack -> $ref, naming images at :$EXPENSE_TRACKER_VERSION"
            docker compose -f /tmp/compose/compose.yaml publish "$ref" \
              --resolve-image-digests --yes
            published=$((published + 1))
          done < /tmp/compose-tags
          # The same guard the staging step applies to the images: a derivation that
          # yielded nothing would otherwise leave a release with its images published and
          # no stack describing them, silently.
          if [ "$published" -eq 0 ]; then
            echo "::error::no compose tags were derived, so the stack was not published."
            exit 1
          fi
          # Read back from the registry, because the signature below covers content rather
          # than a name, and every tag above carries this one digest.
          digest="$(regctl manifest digest "$(head -1 /tmp/compose-tags)")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          echo "$published tag(s) published at $digest"

      # Keyless, reusing this job's own OIDC token, so there is no signing key to hold.
      # The digest is the index's, so one signature covers the image and its attestations.
      - name: Sign every published digest
        env:
          COMPOSE_REPOSITORY: ${{ needs.meta.outputs.compose-repository }}
          COMPOSE_DIGEST: ${{ steps.compose.outputs.digest }}
        run: |
          set -euo pipefail
          for dir in /tmp/images/image-*/; do
            cosign sign --yes "$(cat "$dir/repository")@$(cat "$dir/digest")"
          done
          # The stack on the images' own terms. cosign signs a digest, so the artifact's
          # media type - application/vnd.docker.compose.project - is nothing it has to
          # know about.
          cosign sign --yes "$COMPOSE_REPOSITORY@$COMPOSE_DIGEST"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io
