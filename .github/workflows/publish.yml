name: Publish

# What this repository publishes, and the events that publish it; release.yml is HOW.
# THE FILENAMES LOOK BACKWARDS deliberately - CLAUDE.md states the pair that pins it.
# A `./` reference resolves at this file's own ref, so a release calls release.yml as it
# exists on the tag and `job_workflow_ref` carries that tag.

on:
  release:
    types: [published]
  # The build half only - release.yml guards `push` with an `if` of its own. EVERY PATH,
  # no `paths` filter: that would be a second copy of what the two Dockerfiles copy by
  # name, with nothing checking the two agree.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Declared here rather than in release.yml: GitHub cancels the caller when the two share a
# group. A RELEASE is never cancelled - README.md, under Releases, says why.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    uses: ./.github/workflows/release.yml
    # A ceiling the called workflow can only lower, which `build` does - the isolation
    # invariant CLAUDE.md states.
    permissions:
      contents: read
      id-token: write
    # What each value is, and must contain, is its declaration's `description` in
    # release.yml. Why each is sourced the way it is, README.md records under Releases.
    with:
      directories: '["backend", "database", "frontend"]'
      aws-region: ${{ vars.AWS_REGION }}
      aws-ssm-parameter: /expense-tracker/release/dockerhub-pat
      dockerhub-namespace: ${{ vars.DOCKERHUB_NAMESPACE }}
    secrets:
      aws-role-arn: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
