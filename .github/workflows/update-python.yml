name: Update Python

# pixi.toml pins python with an exact conda-forge version that Dependabot cannot
# track. This job bumps the pin to the newest STABLE conda-forge release the workspace
# can actually solve against, re-solves pixi.lock, then opens a PR. Authenticates as
# the expense-tracker-bot GitHub App (Contents + Pull requests: read/write) rather than
# GITHUB_TOKEN, so the PR behaves like a human-opened one and can trigger any (future)
# required status checks - events made with GITHUB_TOKEN do not start further workflow
# runs.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: TomBorglum/actions/setup-direnv@9f3d52c3fe0bc5903fd4b1ca2729fa78fcaf264b # v1.0.0

      # Move the pin to the newest stable conda-forge python this workspace can solve
      # against, and leave pixi.toml and pixi.lock on it.
      #
      # The newest release is not always installable: every other exact pin in
      # pixi.toml needs a build for it, and a C-extension package lags a new CPython
      # ABI by weeks (python 3.15.0 against pydantic-core 2.46.4, which has no cp315
      # build, is what this job hit). So candidates are tried newest first and the
      # first that solves wins, rather than the newest being assumed installable.
      #
      # One candidate per minor, its highest patch, because the blocker is usually the
      # ABI and so is per minor - that is also what stops a run spending all its
      # attempts on 3.15.x patches and never reaching 3.14.8.
      - name: Select the newest installable Python
        id: select
        env:
          MAX_ATTEMPTS: "5"
        run: |
          set -euo pipefail
          manifest="pixi.toml"
          current="$(grep -oP '^python\s*=\s*"==\K[0-9]+\.[0-9]+\.[0-9]+' "$manifest")"

          # Stable X.Y.Z only: the .versions list is unsorted and carries pre-releases
          # (e.g. 3.15.0a8). `sort -V` first so awk's last write per minor is its
          # highest patch.
          mapfile -t available < <(
            curl -fsSL --proto '=https' \
              "https://api.anaconda.org/package/conda-forge/python" \
              | jq -r '.versions[]' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | awk -F. '{ best[$1"."$2] = $0 } END { for (k in best) print best[k] }' \
              | sort -Vr
          )

          # Strictly newer than the pin, which is what keeps this from ever moving
          # backwards onto a yanked or regressed index.
          candidates=()
          for v in "${available[@]}"; do
            [[ "$v" == "$current" ]] && continue
            if [[ "$(printf '%s\n%s\n' "$v" "$current" | sort -V | tail -n1)" == "$v" ]]; then
              candidates+=("$v")
            fi
          done

          if (( ${#candidates[@]} == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the latest stable ($current); nothing to do." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          skipped=()
          for v in "${candidates[@]:0:$MAX_ATTEMPTS}"; do
            echo "::group::pixi lock against python $v"
            sed -i -E "s|^(python[[:space:]]*=[[:space:]]*)\"==[0-9.]+\"|\1\"==${v}\"|" "$manifest"
            if pixi lock; then
              echo "::endgroup::"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "version=$v" >> "$GITHUB_OUTPUT"
              printf 'Selected python **%s** (from %s).\n' "$v" "$current" \
                >> "$GITHUB_STEP_SUMMARY"
              if (( ${#skipped[@]} )); then
                echo "skipped=${skipped[*]}" >> "$GITHUB_OUTPUT"
                printf 'Skipped, no solution with the current pins: %s\n' "${skipped[*]}" \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            echo "::endgroup::"
            skipped+=("$v")
            # pixi lock rewrites pixi.lock before it fails, so restore both halves
            # before trying the next candidate.
            git checkout -- "$manifest" pixi.lock
          done

          # Nothing newer solves. Deliberately a success: the blocker is a build this
          # repo does not own and cannot produce, it resolves upstream, and a red run
          # every Monday until then is noise rather than signal. The summary is where
          # it stays visible.
          echo "changed=false" >> "$GITHUB_OUTPUT"
          {
            printf 'No newer python solves against the current pins; staying on %s.\n' "$current"
            printf 'Tried, newest first: %s\n' "${skipped[*]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the bot's commit identity
        id: bot
        if: steps.select.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # create-github-app-token exposes the slug but not the numeric user id,
          # which the noreply address needs.
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.select.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: ${{ steps.bot.outputs.name }} <${{ steps.bot.outputs.email }}>
          author: ${{ steps.bot.outputs.name }} <${{ steps.bot.outputs.email }}>
          branch: deps/update-python
          delete-branch: true
          base: main
          commit-message: "deps: bump python to ${{ steps.select.outputs.version }}"
          title: "deps: bump python to ${{ steps.select.outputs.version }}"
          body: |
            Automated bump of the `pixi.toml` python pin to
            **${{ steps.select.outputs.version }}**, the newest stable conda-forge
            release this workspace solves against, with `pixi.lock` re-solved to match.

            Newer releases skipped because no solution exists with the current pins:
            `${{ steps.select.outputs.skipped || 'none' }}`.
