name: OIDC Smoke Test

# Proves the GitHub Actions -> AWS OIDC path end to end; nothing depends on it. Manual
# only - re-run it after any change to the CI role's trust policy or permissions.
# README.md, under Releases, documents the role and the parameter it reads.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-parameter:
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the workflow-level one rather than merging, so
      # contents: read is restated deliberately.
      contents: read
      id-token: write # mint the OIDC token the next-but-one step exchanges
    steps:
      # The claims AWS conditions on, dumped before any AWS call, so a trust-policy
      # mismatch is diagnosable from this run. Only the payload is decoded: the token
      # itself is a live credential and never reaches the log.
      - name: Show the OIDC token claims
        run: |
          set -euo pipefail
          token="$(curl -fsSL --proto '=https' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)"
          payload="$(echo "$token" | cut -d. -f2)"
          # base64url -> base64, then pad to a multiple of 4 so base64 -d accepts it.
          payload="${payload//-/+}"
          payload="${payload//_//}"
          while (( ${#payload} % 4 )); do payload+="="; done
          echo "$payload" | base64 -d | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: oidc-smoke-test

      # sts:GetCallerIdentity needs no IAM permission, so this works on a role granted
      # only the SSM read and the KMS decrypt. The account id is masked first.
      - name: Confirm the assumed identity
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$account"
          aws sts get-caller-identity

      # Both halves of the inline policy at once: ssm:GetParameter, and kms:Decrypt via
      # --with-decryption, the half more likely to be wrong.
      - name: Read the Docker Hub PAT
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter \
            --name /expense-tracker/ci/dockerhub-pat \
            --with-decryption \
            --query Parameter.Value \
            --output text)"
          # Masked before it is echoed: the log proves the read without publishing it.
          echo "::add-mask::$value"
          echo "Parameter value: $value"
