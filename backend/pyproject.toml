[project]
name = "expense-tracker"
version = "0"                    # inert placeholder; release version lives in .release-please-manifest.json
requires-python = ">=3.14"
dependencies = []               # runtime deps are conda-pinned in pixi.toml (repo convention, CLAUDE.md)

[build-system]
requires = ["hatchling==1.31.0"]  # pin exactly (CLAUDE.md); not captured in pixi.lock
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

[tool.ruff.lint]
# Widen beyond ruff's default E/F: import sorting (I), pyupgrade (UP),
# bugbear (B), simplify (SIM), and Ruff-native rules (RUF). Target version is
# inferred from [project].requires-python.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
# Explicit rather than relying on rootdir discovery, so collection does not depend
# on which directory pytest is invoked from.
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=expense_tracker --cov-report=xml --cov-report=term-missing"

[tool.basedpyright]
typeCheckingMode = "strict"
# Both paths are relative to THIS file, so they mean backend/src and backend/tests even
# when the run starts at the repo root - which it does, because pyrightconfig.json there
# extends this section so the editor's language server can find it. See that file.
include = ["src", "tests"]
extraPaths = ["src"]
