[project]
name = "expense-tracker"
version = "0"                    # inert placeholder; release version lives in .release-please-manifest.json
requires-python = ">=3.14"
dependencies = []               # runtime deps are conda-pinned in pixi.toml (repo convention, CLAUDE.md)

[build-system]
requires = ["hatchling==1.31.0"]  # pin exactly (CLAUDE.md); not captured in pixi.lock
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

# Every backend command is defined here; pixi.toml forwards to each as
# `pixi run backend-<task>`, and a task added here needs its forwarder added there.
# `poe <task>` from backend/ or `poe -C backend <task>` from anywhere both run with the
# working directory at backend/, so the paths below are relative to it.
[tool.poe]
# The environment is already active - direnv's use_pixi puts .pixi/envs/default/bin on
# PATH locally, CI's setup-direnv puts it on $GITHUB_PATH. "simple" stops poe hunting for
# a poetry/uv project or a .venv that does not exist here.
executor = "simple"
# No `envfile`: PGHOST, PGPORT, PGUSER, PGDATABASE and UVICORN_PORT reach a task from the
# environment direnv already built, which is what lets the db-* tasks omit
# --host/--port/--username and `dev` omit --port.

# Alphabetical, matching the forwarder table in pixi.toml and what `poe` with no task
# prints.
[tool.poe.tasks]
# --- The local PostgreSQL cluster -------------------------------------------------
#
# A cluster owned by this checkout: initdb'd into .pgdata/ beside this file (gitignored),
# on the host and port backend/.env names, with a superuser and a database both named
# after the project.
#
# `shell`, not the default `cmd`: the `||` guards that make each one idempotent need a
# real shell to interpret them.
#
# The two that reach a server open with a `${PGPORT:?}` guard, which aborts the task when
# the name is unset - initdb, psql and createdb each fall back to port 5432 and the OS
# username on their own. See backend/CLAUDE.md.

# initdb refuses a non-empty directory, so the PG_VERSION probe is what makes a second
# run a no-op - which also means an existing .pgdata/ keeps the port it was created with
# until db-reset throws it away. The three --set flags are written into the generated
# postgresql.conf, which is why db-start needs no -o "-p $PGPORT".
# --auth=trust is safe only because of listen_addresses: this is a throwaway dev cluster,
# and the flags must not be copied anywhere real.
db-create.shell = """
: "${PGPORT:?unset - run 'direnv allow'}"
test -f .pgdata/PG_VERSION ||
  initdb --pgdata=.pgdata --username=expense_tracker \
         --auth-local=trust --auth-host=trust --encoding=UTF8 --locale=C \
         --no-instructions --set=port="$PGPORT" --set=listen_addresses=127.0.0.1 \
         --set=unix_socket_directories=/tmp
"""
# Reads as (probe || createdb) && apply-schema, which is left-associative, so the schema
# is applied down either branch. The probe is psql's own exit code - it fails when the
# database does not exist - so there is nothing to grep. schema.sql is idempotent, which
# is what makes re-running this against a live cluster a no-op.
#
# Deliberately not a dep of `test`; see backend/CLAUDE.md.
db-init.shell = """
: "${PGPORT:?unset - run 'direnv allow'}"
psql --tuples-only --output=/dev/null --command='SELECT 1' || createdb expense_tracker &&
  psql --set=ON_ERROR_STOP=1 --file=schema.sql
"""
db-init.deps = ["db-start"]
# Throw the cluster away and start over. Nothing in .pgdata/ is precious, and this is the
# cure for a change to an existing table, which schema.sql's IF NOT EXISTS cannot apply.
db-reset.shell = "rm -rf .pgdata"
db-reset.deps = ["db-stop"]
# `pg_ctl status` exits 3 when nothing is running and 0 when something is, which is the
# whole idempotency check. It also sees through a stale postmaster.pid.
#
# On a failed start pg_ctl says only "Examine the log output.", so the third arm examines
# it: `tail -c +` from the size measured beforehand prints the bytes this attempt appended
# and no earlier run's. The `test -f` guard is for the first start of a fresh cluster,
# which has no log yet.
db-start.shell = """
size=0
test -f .pgdata/server.log && size=$(wc -c < .pgdata/server.log)
pg_ctl --pgdata=.pgdata status ||
  pg_ctl --pgdata=.pgdata --log=.pgdata/server.log --wait start ||
  { tail -c +$((size + 1)) .pgdata/server.log >&2; exit 1; }
"""
db-start.deps = ["db-create"]
# Tolerant of an already-stopped cluster, so it is safe to run blind and safe to chain.
db-stop.shell = "pg_ctl --pgdata=.pgdata --mode=fast --wait stop || exit 0"

# The REST API with the reloader, on the port UVICORN_PORT names in backend/.env - no
# --port needed, uvicorn's own CLI reads that name. --factory lets create_app be the
# target.
#
# --reload-dir is not optional: without it uvicorn's stat reloader rglobs the whole
# working directory for *.py four times a second, walking .pixi/ and node_modules/ to find
# 1891 files when the only one that can matter is src/expense_tracker/__init__.py.
#
# The db-init dep runs the cluster chain once before uvicorn and leaves it up afterwards;
# db-stop and db-reset own its lifecycle. See backend/CLAUDE.md.
dev.cmd = "uvicorn expense_tracker:create_app --factory --reload --reload-dir src"
dev.deps = ["db-init"]
format = "ruff format"
format-check = "ruff format --check"
# Two linters, one gate: ruff over each file, then import-linter over the graph they form,
# against [tool.importlinter] below. import-linter's cwd is this directory, which is how it
# finds its config unaided - no --config flag.
#
# ruff first: an import that violates a contract is usually also unused, so F401 names the
# offending line before the graph is even built, and a sequence stops at the first failure.
lint.sequence = [{ cmd = "ruff check" }, { cmd = "lint-imports" }]
# Only ruff; import-linter has no fixer. Deliberately not the inverse of `lint`.
lint-fix = "ruff check --fix"
# Read data/currencies/*.tsv into the database, replacing every rate already there, so the
# table ends up matching the files whatever it held before.
load-currencies = "python -m expense_tracker.currency_loader data/currencies"
# Read data/expenses/*.tsv into the database. Idempotent because the loaded_expense_file
# ledger remembers which files are already in.
load-expenses = "python -m expense_tracker.expense_loader data/expenses"
# Writes backend/coverage.xml for the SonarCloud scan (see sonar-project.properties).
test = "pytest"
typecheck = "basedpyright"

[tool.ruff.lint]
# Widen beyond ruff's default E/F: import sorting (I), pyupgrade (UP), bugbear (B),
# simplify (SIM), Ruff-native (RUF). Target version comes from [project].requires-python.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# The dependency order between this package's modules. ruff cannot cover it: TID251 bans a
# name project-wide, and ruff builds no cross-module graph, so it sees no cycles at all.
[tool.importlinter]
root_package = "expense_tracker"
# Needed by the "db knows nothing about HTTP" contract, which names packages outside the
# root. Off by default, in which case only intra-package imports are graphed.
include_external_packages = true

# The stack, top to bottom, relative to the package: the entry points may import the
# repositories, and never the reverse. Siblings joined with "|" may NOT import each other;
# ":" says the opposite, so the choice is load-bearing rather than cosmetic.
#
# __init__.py is the container's own module rather than one of its children, so it is not
# a layer and is unconstrained. The contract that stops anything importing back into it is
# below. Why conversion takes a layer of its own is in backend/CLAUDE.md.
[[tool.importlinter.contracts]]
name = "expense_tracker layers: the entry points above persistence"
type = "layers"
containers = ["expense_tracker"]
layers = [
  "deps | currency_loader | expense_loader",
  "conversion",
  "currency_repository | expense_repository",
  "db | config",
]
# A module added under src/expense_tracker/ that is not named above breaks this contract.
# So the gate covers new code by default: an unnamed module fails it.
exhaustive = true

# The "only deps.py imports fastapi" half of the invariant, which the layers contract
# cannot express because fastapi is outside the root package. starlette is named too - it
# is what an HTTPException import reaches through, and fastapi re-exports from it.
#
# A forbidden contract has no `exhaustive` option, unlike the layers one above, so this
# list does not grow by itself: a new module is silently uncovered until it is named here.
[[tool.importlinter.contracts]]
name = "only the HTTP layer knows about HTTP"
type = "forbidden"
source_modules = [
  "expense_tracker.config",
  "expense_tracker.conversion",
  "expense_tracker.currency_loader",
  "expense_tracker.currency_repository",
  "expense_tracker.db",
  "expense_tracker.expense_loader",
  "expense_tracker.expense_repository",
]
forbidden_modules = ["fastapi", "starlette"]

# Nothing inside the package may import the package root, which is the one cycle the
# layers contract leaves open - a container is not one of its own layers.
# as_packages = false is load-bearing: by default a forbidden module covers its
# descendants too, so "expense_tracker" would match db and deps and forbid the very edge
# the layers contract exists to permit. Not exhaustive either - name new modules here.
[[tool.importlinter.contracts]]
name = "nothing imports back into create_app"
type = "forbidden"
source_modules = [
  "expense_tracker.config",
  "expense_tracker.conversion",
  "expense_tracker.currency_loader",
  "expense_tracker.currency_repository",
  "expense_tracker.db",
  "expense_tracker.deps",
  "expense_tracker.expense_loader",
  "expense_tracker.expense_repository",
]
forbidden_modules = ["expense_tracker"]
as_packages = false

# Cycles, directly. The layers contract implies this only at the top level and only
# between layers; this one drills down through subpackages as they appear (depth defaults
# to 10) and keeps holding without being re-edited.
[[tool.importlinter.contracts]]
name = "no import cycles anywhere in the package"
type = "acyclic_siblings"
ancestors = ["expense_tracker"]

[tool.pytest.ini_options]
# Explicit rather than relying on rootdir discovery, so collection does not depend
# on which directory pytest is invoked from.
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=expense_tracker --cov-report=xml --cov-report=term-missing"
# --strict-markers is on, so this registration is what makes the marker legal. It is a
# label rather than a filter: the marked modules skip themselves when no server answers,
# and fail instead of skipping under CI.
markers = [
  "postgres: exercises a real PostgreSQL server; needs `pixi run backend-db-init`",
]

[tool.basedpyright]
# basedpyright's own default, and a superset of pyright's `strict`: it adds the based-only
# rules (reportUnusedCallResult, reportAny, reportImplicitOverride) and sets failOnWarnings,
# so a warning fails `pixi run backend-typecheck` exactly like an error.
typeCheckingMode = "recommended"
# Relative to this file, so backend/src and backend/tests.
include = ["src", "tests"]
extraPaths = ["src"]
# Authoritative for editors too: Zed sends this directory as the LSP workspace folder, and
# basedpyright ignores a developer's personal typeCheckingMode whenever it finds a project
# config. See "Editor setup (Zed)" in README.md.
